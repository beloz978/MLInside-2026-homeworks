# Подсказки к непройденным подпроверкам отчёта `make check` (scripts/check_hw.py).
# match — регэксп по тексту подпроверки (первое совпадение выигрывает, поэтому общие — внизу),
# hint — что делать, url — ссылка (необязательно). Порядок записей важен.
- match: "^inspect_defs"
  hint: "Определения не загрузились. Проверьте HW_DAGSTER_MODULE и что модуль содержит переменную `defs` (dg.Definitions) или функцию с @dg.definitions; ошибку смотрите в details. Если dbt-проект собирается из manifest.json — сначала соберите его (dbt parse)."
  url: https://docs.dagster.io/api/dagster/definitions
- match: "^в графе ≥"
  hint: "Граф пуст. Добавьте ассеты в Definitions(assets=[...])."
  url: https://docs.dagster.io/guides/build/assets
- match: "^есть raw-ассеты"
  hint: "Нужен хотя бы один ассет без upstream, который кладёт данные в хранилище: `dbt seed` как ассеты dagster-dbt или собственный @asset."
  url: https://docs.dagster.io/integrations/libraries/dbt
- match: "^исходные данные загружены"
  hint: "Таблицы Olist не найдены или строк не столько, сколько нужно. Загрузите все 8 таблиц (dbt seed или свой ассет) и запустите проверку без --no-run; ожидаемые числа — в ДЗ по dbt, раздел 0."
  url: https://docs.dagster.io/guides/build/assets
- match: "^dbt-модели — ассеты"
  hint: "Подключите dbt-проект через @dbt_assets (dagster-dbt) — такие ассеты получают kind «dbt»."
  url: https://docs.dagster.io/integrations/libraries/dbt
- match: "^≥ \\d+ staging"
  hint: "Ключи staging-ассетов должны начинаться с `stg_` (имена моделей из ДЗ по dbt)."
- match: "^≥ \\d+ витрины в графе"
  hint: "В граф должны попасть минимум 2 витрины (модели marts), у которых есть upstream."
- match: "^lineage без разрывов"
  hint: "Модели читают source(), а seeds — отдельные ассеты: источник остаётся внешним ассетом, и связи raw → staging нет. Свяжите их: в DagsterDbtTranslator.get_asset_spec подмените зависимость источника на seed с тем же identifier (ключ источника нельзя сделать равным ключу seed — dagster-dbt запрещает дубли)."
  url: https://docs.dagster.io/integrations/libraries/dbt/reference
- match: "^у каждого staging"
  hint: "У staging и витрин должны быть upstream-ассеты (raw → staging → marts)."
- match: "^у dbt-ассетов ≥"
  hint: "dbt-тесты становятся asset checks при запуске `dbt build` через @dbt_assets (`yield from dbt.cli([\"build\"], context=context).stream()`), а не `dbt run`."
  url: https://docs.dagster.io/integrations/libraries/dbt/reference
- match: "^все asset checks"
  hint: "Есть непройденные тесты или нет результатов запуска. Запустите проверку без --no-run и исправьте тесты dbt."
- match: "^≥ \\d+ витрины: колонки"
  hint: "Колонки или цифры витрин не совпали с эталоном — смотрите details. Контракт и эталон те же, что в ДЗ по dbt."
- match: "^есть ежедневное расписание"
  hint: "Добавьте ScheduleDefinition с cron вида `0 6 * * *` (или @daily) в Definitions(schedules=[...])."
  url: https://docs.dagster.io/guides/automate/schedules
- match: "^расписание запускает джоб"
  hint: "Расписание должно запускать джоб, в который входят все витрины (например define_asset_job с AssetSelection.all())."
  url: https://docs.dagster.io/guides/automate/schedules
- match: "^запуск из командной строки"
  hint: "`dagster asset materialize -m <модуль> --select '*'` завершился ошибкой. Запустите его вручную и посмотрите вывод; частые причины: нет manifest.json dbt, не загружены seeds."
  url: https://docs.dagster.io/api/clis/dagster-cli
- match: "витрина с declarative automation"
  hint: "Задайте витринам automation_condition, например AutomationCondition.eager(): для dbt — в DagsterDbtTranslator.get_asset_spec через spec.replace_attributes(automation_condition=...). Сенсор автоматизации по умолчанию выключен — включите его в UI (Automation) или создайте AutomationConditionSensorDefinition с default_status=RUNNING."
  url: https://docs.dagster.io/guides/automate/declarative-automation
- match: "ассет с freshness policy"
  hint: "Добавьте FreshnessPolicy.time_window(fail_window=..., warn_window=...) хотя бы одной витрине (для dbt — через replace_attributes(freshness_policy=...) в трансляторе)."
  url: https://docs.dagster.io/guides/observe/asset-freshness-policies
- match: "^секреты не в репозитории"
  hint: "Токены и пароли — только в .env.local (в .gitignore) и GitHub Secrets; в коде читайте их через dg.EnvVar. Найденный в истории git токен считайте скомпрометированным: отзовите и выпустите новый."
  url: https://docs.dagster.io/guides/operate/configuration/using-environment-variables-and-secrets
- match: "^есть сенсор на сбой"
  hint: "Добавьте @dg.run_failure_sensor — он срабатывает на любой упавший запуск — и передайте его в Definitions(sensors=[...])."
  url: https://docs.dagster.io/guides/automate/sensors/run-status-sensors
- match: "^алерт уходит в Telegram"
  hint: "Сенсор на сбой должен отправлять сообщение в Telegram: ресурс с bot_token и chat_id из dg.EnvVar, запрос к https://api.telegram.org/bot<токен>/sendMessage."
  url: https://core.telegram.org/bots/api#sendmessage
- match: "пункт «Как устроен Dagster»"
  hint: "Сделайте хотя бы одно: ресурсы, выбираемые по DAGSTER_ENV (dev/prod); pytest-тесты ассетов (dg.materialize в tests/test_*.py); RetryPolicy на ассете вместе с блокирующим asset check (blocking=True)."
  url: https://docs.dagster.io/guides/test/unit-testing-assets-and-ops
- match: "^pre-commit"
  hint: "Добавьте .pre-commit-config.yaml с линтером Python (ruff) и SQL (sqlfluff) и поставьте хуки: pre-commit install."
  url: https://pre-commit.com/
- match: "^GitHub Actions: workflow"
  hint: "Добавьте .github/workflows/*.yml, который проверяет определения (`dagster definitions validate -m <модуль>` или `dg check defs`) и запускает pytest. В CI нет CSV Olist: без seeds dbt не видит raw-слой, граф рвётся — положите в seeds хотя бы заголовки CSV."
  url: https://docs.github.com/actions
- match: "^CI на коммите PR"
  hint: "CI на последнем коммите PR должен быть зелёным: откройте вкладку Actions, исправьте упавший шаг и запушьте."
- match: "^README"
  hint: "В README опишите установку и запуск проекта (команды uv/pip, `dagster dev`, `dagster asset materialize`)."
- match: "^GitHub API"
  hint: "Нет доступа к GitHub. Задайте токен: GH_TOKEN в config/.env.local или `gh auth login`."
- match: "^PR найден"
  hint: "Создайте pull request с проектом или задайте HW_GH_REPO / HW_GH_PR."
- match: "^описание PR"
  hint: "Заполните описание PR: версии пакетов, список реализованных пунктов, скриншоты."
- match: "^в описании PR указаны версии"
  hint: "Укажите в описании PR версии dagster, dagster-dbt, dbt-core и адаптера, например `dagster-dbt 0.29.26`."
- match: "^в описании PR есть скриншот"
  hint: "Приложите скриншот Global Asset Lineage или страницы успешного запуска."
