  topic:
    ru: Дедупликация и мутации
  text:
    ru: You need `ReplacingMergeTree` with the version column `updated_at DateTime` and the delete flag `is_deleted UInt8`. Which engine definition is correct?
  options:
  - text:
      ru: '`ReplacingMergeTree(updated_at, is_deleted)`'
    correct: true
  - text:
      ru: '`ReplacingMergeTree(is_deleted, updated_at)`'
    correct: false
  - text:
      ru: '`ReplacingMergeTree(is_deleted)`'
    correct: false
  - text:
      ru: '`ReplacingMergeTree(updated_at) PARTITION BY is_deleted`'
    correct: false
  hints:
    ru:
    - Версия идёт первым аргументом, флаг удаления — вторым; флаг без версии не работает.
  explanation:
    ru: 'D5 Dedup and mutations (5.2). Сигнатура — `ReplacingMergeTree([ver [, is_deleted]])`. Если указать только `is_deleted` (В), движок молча воспримет колонку как версию — создание таблицы проходит без ошибки (проверено), но флаг удаления не действует. При перестановке аргументов (Б) создание падает (`Code 169 BAD_TYPE_OF_FIELD: is_deleted column (updated_at) … must have type UInt8`). При правильной записи `FINAL` скрывает ключи, у которых последняя версия помечена удалённой (проверено: 0 строк). `PARTITION BY` дубликаты не убирает.'
