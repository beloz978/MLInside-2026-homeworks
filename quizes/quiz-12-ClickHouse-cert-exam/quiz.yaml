langs:
- ru
title:
  ru: Тест 12. ClickHouse Certified Developer — пробный экзамен
meta:
  ru:
    audience: Data engineers, готовящиеся к ClickHouse Certified Developer
    purpose: 'Один пробный экзамен в объёме и сложности настоящего: 12 заданий по 5 официальным областям, формулировки на английском, разбор на русском'
    goal: 'Выбирать правильное решение в ClickHouse: ключ сортировки и типы, загрузка файлов, аналитические запросы, materialized views, индексы и проекции, дедупликация и мутации'
    context: Официальные цели экзамена (5 областей, 19 целей) из проекта MyCerts; каждое решение и каждая «ловушка» проверены на ClickHouse 26.11; контекст сессии — в каталоге session/
    prerequisites: Базовый SQL; clickhouse-client; семейство MergeTree
    duration_min: 120
questions:
- id: q1
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟨 применение
  topic:
    ru: Моделирование
  text:
    ru: You are creating a table for 5 billion billing events. Queries almost always filter by `tenant_id` (about 300 distinct values) and by a time range, and `price` must be stored exactly. Which table definition should you use?
  options:
  - text:
      ru: '`CREATE TABLE ev (tenant_id UInt32, ts DateTime, country LowCardinality(String), price Float64) ENGINE = MergeTree ORDER BY (ts, tenant_id)`'
    correct: false
  - text:
      ru: '`CREATE TABLE ev (tenant_id UInt32, ts String, country String, price Float64) ENGINE = MergeTree ORDER BY tenant_id`'
    correct: false
  - text:
      ru: '`CREATE TABLE ev (tenant_id UInt32, ts DateTime, country LowCardinality(String), price Decimal(12, 2)) ENGINE = MergeTree ORDER BY (tenant_id, ts)`'
    correct: true
  - text:
      ru: '`CREATE TABLE ev (tenant_id Nullable(UInt32), ts DateTime, country String, price Decimal(12, 2)) ENGINE = MergeTree ORDER BY (tenant_id, ts)`'
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D1 Modeling (1.1–1.3). Ключ сортировки строится по фильтрам: сначала колонка с малой кардинальностью (`tenant_id`), затем время — тогда диапазон по времени внутри арендатора читается одним куском гранул. `ORDER BY (ts, tenant_id)` ставит самую «широкую» колонку первой, и фильтр по `tenant_id` почти не отсекает гранулы. Деньги хранят в `Decimal`, а не в `Float64` (погрешность). Время — `DateTime`, не `String`. `Nullable` в ключе по умолчанию запрещён (нужна настройка `allow_nullable_key`) и замедляет запросы. `LowCardinality(String)` — удачный тип для колонки с небольшим числом значений.'
- id: q2
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: Моделирование
  text:
    ru: 'Table `orders` has `country_id UInt64`. The small table `countries (id UInt64, name String)` changes rarely. You created: `CREATE DICTIONARY dict_country (id UInt64, name String) PRIMARY KEY id SOURCE(CLICKHOUSE(TABLE ''countries'')) LAYOUT(FLAT()) LIFETIME(300)`. Which query returns the country name for every order without a JOIN?'
  options:
  - text:
      ru: '`SELECT order_id, dictGet(''dict_country'', country_id, ''name'') FROM orders`'
    correct: false
  - text:
      ru: '`SELECT order_id, dictGet(''dict_country'', ''name'', country_id) FROM orders`'
    correct: true
  - text:
      ru: '`SELECT order_id, dictGet(dict_country, name, country_id) FROM orders`'
    correct: false
  - text:
      ru: '`SELECT order_id, joinGet(''dict_country'', ''name'', country_id) FROM orders`'
    correct: false
  hints:
    ru:
    - Имя словаря и имя атрибута — строковые литералы, а ключ идёт последним аргументом.
  explanation:
    ru: 'D1 Modeling (1.4). Сигнатура — `dictGet(''словарь'', ''атрибут'', ключ)`. Перестановка аргументов (А) даёт `Code 43 ILLEGAL_TYPE_OF_ARGUMENT`, имена без кавычек (В) — `Code 47 UNKNOWN_IDENTIFIER`, `joinGet` (Г) работает только с таблицами движка Join (`Code 43: Table dict_country should have engine StorageJoin`). Проверено на 26.11. Документация: `sql-reference/functions/ext-dict-functions`, `sql-reference/dictionaries`.'
- id: q3
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: Загрузка данных
  text:
    ru: The file `/home/me/events.csv` (with a header row) is on the machine where you run `clickhouse-client`; the server is remote. You need to load it into the table `events`. Which statement should you use?
  options:
  - text:
      ru: '`INSERT INTO events FROM INFILE ''/home/me/events.csv'' FORMAT CSVWithNames`'
    correct: true
  - text:
      ru: '`INSERT INTO events SELECT * FROM file(''/home/me/events.csv'', CSVWithNames)`'
    correct: false
  - text:
      ru: '`COPY events FROM ''/home/me/events.csv'' WITH (FORMAT csv, HEADER true)`'
    correct: false
  - text:
      ru: '`LOAD DATA LOCAL INFILE ''/home/me/events.csv'' INTO TABLE events`'
    correct: false
  hints:
    ru: []
  explanation:
    ru: D2 Inserting (2.1). `INSERT … FROM INFILE` читает файл на стороне клиента и отправляет данные серверу; формат задаётся словом `FORMAT` в конце. Табличная функция `file()` читает файлы сервера из `user_files_path`, а не файлы клиента. `COPY … FROM` (PostgreSQL) и `LOAD DATA` (MySQL) в ClickHouse не существуют. Для подтверждения после загрузки выполните `SELECT count()`.
- id: q4
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: Загрузка данных
  text:
    ru: The table `events (ts DateTime, user_id UInt64, url String, domain String)` is empty. A CSV file with a header, available at `https://example.com/events.csv`, has the columns `ts_unix` (Unix seconds), `user_id` and `url`. The column `domain` must contain the host name of `url`. Which statement loads the data correctly?
  options:
  - text:
      ru: '`INSERT INTO events SELECT * FROM url(''https://example.com/events.csv'', ''CSVWithNames'')`'
    correct: false
  - text:
      ru: '`INSERT INTO events SELECT toDateTime(ts_unix), user_id, url, domain(url) FROM url(''https://example.com/events.csv'', ''CSVWithNames'')`'
    correct: true
  - text:
      ru: '`INSERT INTO events (ts, user_id, url) SELECT * FROM url(''https://example.com/events.csv'', ''CSVWithNames'')`'
    correct: false
  - text:
      ru: '`INSERT INTO events SELECT toDateTime(ts_unix), user_id, url FROM url(''https://example.com/events.csv'', ''CSVWithNames'')`'
    correct: false
  hints:
    ru:
    - Число и порядок колонок в `SELECT` должны совпадать с таблицей, а `domain()` извлекает хост из URL.
  explanation:
    ru: 'D2 Inserting (2.2–2.3). Преобразования при вставке делаются в `INSERT … SELECT`: колонки перечисляются в порядке таблицы, значения считаются выражениями. Вариант Г падает с `Code 20 NUMBER_OF_COLUMNS_DOESNT_MATCH` (3 колонки против 4). Варианты А и В не падают, но молча дают неверные данные: `ts` остаётся `1970-01-01 00:00:00`, а `domain` пустой (проверено на 26.11 с `file()`). Это худший класс ошибок на практическом экзамене — вставка прошла, данные неверны, поэтому после загрузки всегда проверяйте `SELECT * … LIMIT 3`.'
- id: q5
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: Анализ данных
  text:
    ru: Table `requests (ts DateTime, endpoint String, user_id UInt64, latency_ms UInt32)`. Return the 10 endpoints with the highest 95th percentile of latency over the last 24 hours, together with the number of distinct users. Approximate results are acceptable. Which query is correct?
  options:
  - text:
      ru: '`SELECT endpoint, quantile(latency_ms, 0.95) AS p95, uniq(user_id) AS users FROM requests WHERE ts >= now() - INTERVAL 1 DAY GROUP BY endpoint ORDER BY p95 DESC LIMIT 10`'
    correct: false
  - text:
      ru: '`SELECT endpoint, percentile(latency_ms, 95) AS p95, uniq(user_id) AS users FROM requests WHERE ts >= now() - INTERVAL 1 DAY GROUP BY endpoint ORDER BY p95 DESC LIMIT 10`'
    correct: false
  - text:
      ru: '`SELECT endpoint, quantile(0.95)(latency_ms) AS p95, uniq(user_id) AS users FROM requests WHERE ts >= now() - INTERVAL 1 DAY GROUP BY endpoint ORDER BY users DESC LIMIT 10`'
    correct: false
  - text:
      ru: '`SELECT endpoint, quantile(0.95)(latency_ms) AS p95, uniq(user_id) AS users FROM requests WHERE ts >= now() - INTERVAL 1 DAY GROUP BY endpoint ORDER BY p95 DESC LIMIT 10`'
    correct: true
  hints:
    ru:
    - Уровень квантиля у параметрических агрегатных функций ClickHouse записывается в первых скобках.
  explanation:
    ru: 'D3 Analyzing (3.2–3.3). Правильный синтаксис — `quantile(0.95)(col)`: уровень в первых скобках, столбец во вторых. `quantile(col, 0.95)` даёт `Code 42 NUMBER_OF_ARGUMENTS_DOESNT_MATCH`, функции `percentile` в ClickHouse нет (`Code 46 UNKNOWN_FUNCTION`). Вариант В сортирует по `users`, а не по p95. `quantile` и `uniq` — приближённые функции; если нужна точность, берут `quantileExact` и `uniqExact`. Проверено на 26.11.'
- id: q6
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: Анализ данных
  text:
    ru: Table `events (ts DateTime, url String)`. Count events per 15-minute bucket, only for rows whose `url` contains the word `checkout` in any letter case. Which query is correct?
  options:
  - text:
      ru: '`SELECT toStartOfInterval(ts, INTERVAL 15 MINUTE) AS b, count() FROM events WHERE url ILIKE ''%checkout%'' GROUP BY b ORDER BY b`'
    correct: true
  - text:
      ru: '`SELECT toStartOfHour(ts) AS b, count() FROM events WHERE url ILIKE ''%checkout%'' GROUP BY b ORDER BY b`'
    correct: false
  - text:
      ru: '`SELECT toStartOfInterval(ts, INTERVAL 15 MINUTE) AS b, count() FROM events WHERE url LIKE ''%checkout%'' GROUP BY b ORDER BY b`'
    correct: false
  - text:
      ru: '`SELECT toStartOfInterval(ts, INTERVAL 15 MINUTE) AS b, count() FROM events WHERE position(url, ''checkout'') > 0 GROUP BY b ORDER BY b`'
    correct: false
  hints:
    ru: []
  explanation:
    ru: D3 Analyzing (3.1, 3.4). `toStartOfInterval(ts, INTERVAL 15 MINUTE)` — универсальный способ получить корзину времени, а `ILIKE` и `positionCaseInsensitive` ищут подстроку без учёта регистра. `LIKE` и `position` различают регистр, поэтому в тестовых данных с `/Checkout/` они возвращают 0 строк, а `ILIKE` — все 5000 (проверено на 26.11). `toStartOfHour` даёт корзины по часу, а не по 15 минут.
- id: q7
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: Оптимизация
  text:
    ru: Table `events` already contains 2 billion rows. You created `events_by_day (day Date, n UInt64) ENGINE = SummingMergeTree ORDER BY day` and `CREATE MATERIALIZED VIEW events_by_day_mv TO events_by_day AS SELECT toDate(ts) AS day, count() AS n FROM events GROUP BY day`. The target table must contain counts for all existing and future rows. What should you do?
  options:
  - text:
      ru: 'Do nothing: a materialized view also processes the rows that were inserted into `events` before the view was created'
    correct: false
  - text:
      ru: Run `OPTIMIZE TABLE events_by_day FINAL` so that the old rows are merged into the target
    correct: false
  - text:
      ru: Run `INSERT INTO events_by_day SELECT toDate(ts), count() FROM events WHERE ts < '<view creation time>' GROUP BY 1`
    correct: true
  - text:
      ru: Run `SYSTEM REFRESH VIEW events_by_day_mv` to rebuild the view from the source table
    correct: false
  hints:
    ru:
    - 'Materialized view — это триггер на вставку: он видит только блоки, вставленные после его создания.'
  explanation:
    ru: 'D4 Optimizing (4.1–4.2). Обычная materialized view с `TO` обрабатывает только новые вставки, поэтому историю нужно досыпать вручную запросом `INSERT … SELECT` с тем же `SELECT`, ограничив его моментом создания view (иначе строки посчитаются дважды). Проверено: после создания view и одной вставки в целевой таблице оказалась 1 строка, а не вся история. `OPTIMIZE` только сливает уже существующие куски, а `SYSTEM REFRESH VIEW` относится к refreshable MV (`REFRESH EVERY …`), а не к обычным.'
- id: q8
  section: main
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: Оптимизация
  text:
    ru: You need daily unique users and total revenue from `events (ts DateTime, user_id UInt64, amount UInt64)`; dashboards read hundreds of billions of rows. Which design is correct (target table / materialized view / dashboard query)?
  options:
  - text:
      ru: SummingMergeTree `(day, users UInt64, revenue UInt64)` / `uniq(user_id) AS users, sum(amount) AS revenue … GROUP BY day` / `SELECT day, sum(users), sum(revenue) FROM t GROUP BY day`
    correct: false
  - text:
      ru: AggregatingMergeTree `(day, users AggregateFunction(uniq, UInt64), revenue SimpleAggregateFunction(sum, UInt64))` / `uniqState(user_id) AS users, sum(amount) AS revenue … GROUP BY day` / `SELECT day, uniqMerge(users), sum(revenue) FROM t GROUP BY day`
    correct: true
  - text:
      ru: AggregatingMergeTree `(day, users AggregateFunction(uniq, UInt64), revenue SimpleAggregateFunction(sum, UInt64))` / `uniq(user_id) AS users, sum(amount) AS revenue … GROUP BY day` / `SELECT day, uniqMerge(users), sum(revenue) FROM t GROUP BY day`
    correct: false
  - text:
      ru: AggregatingMergeTree `(day, users AggregateFunction(uniq, UInt64), revenue SimpleAggregateFunction(sum, UInt64))` / `uniqState(user_id) AS users, sum(amount) AS revenue … GROUP BY day` / `SELECT day, uniq(users), sum(revenue) FROM t GROUP BY day`
    correct: false
  hints:
    ru:
    - 'Уникальных пользователей нельзя складывать между частями: нужно хранить промежуточное состояние агрегата.'
    - Запись состояния — суффикс `-State`, чтение и слияние — `-Merge`.
  explanation:
    ru: 'D4 Optimizing (4.2). Для неаддитивных агрегатов (`uniq`, квантили) хранят состояние: тип `AggregateFunction(uniq, UInt64)`, запись `uniqState`, чтение `uniqMerge`. А даёт завышенные числа: сумма уникальных по частям — не число уникальных. В падает при создании view с `Code 70 CANNOT_CONVERT_TYPE` (нельзя записать UInt64 в колонку состояния). Г не падает, но молча возвращает неверный результат: на тестовых данных вместо 7 уникальных пользователей он вернул 1 (проверено на 26.11). Аддитивный `revenue` удобно хранить как `SimpleAggregateFunction(sum, UInt64)`.'
- id: q9
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: Оптимизация
  text:
    ru: Table `events` has `ORDER BY ts`. Dashboards run `WHERE user_id = 42` and read almost every granule, although the values of `user_id` are stored in clusters (each user appears in a narrow time window). The data already in the table must also benefit. What should you do?
  options:
  - text:
      ru: '`ALTER TABLE events ADD INDEX idx_user user_id TYPE set(100) GRANULARITY 1`'
    correct: false
  - text:
      ru: '`ALTER TABLE events MODIFY ORDER BY user_id`'
    correct: false
  - text:
      ru: '`ALTER TABLE events ADD INDEX idx_user user_id TYPE set(100) GRANULARITY 1`, then `ALTER TABLE events MATERIALIZE PROJECTION idx_user`'
    correct: false
  - text:
      ru: '`ALTER TABLE events ADD INDEX idx_user user_id TYPE set(100) GRANULARITY 1`, then `ALTER TABLE events MATERIALIZE INDEX idx_user`'
    correct: true
  hints:
    ru:
    - Индекс пропуска, добавленный через `ALTER`, применяется только к новым кускам, пока его не построят для старых.
    - Результат проверяется командой `EXPLAIN indexes = 1`.
  explanation:
    ru: 'D4 Optimizing (4.4). Skip-индекс (`set`, `minmax`, `bloom_filter`) после `ADD INDEX` строится лишь для новых кусков; для существующих нужен `MATERIALIZE INDEX`. Проверено на 26.11: до материализации `EXPLAIN indexes = 1` показывает `Granules: 24/24`, после — `1/24`. `MODIFY ORDER BY` может только дописать новые колонки в конец ключа и не позволяет заменить ключ (`Code 36 BAD_ARGUMENTS`). `MATERIALIZE PROJECTION` относится к проекциям и для индекса не работает. Индекс полезен именно потому, что значения коррелируют с порядком хранения: при случайном `user_id` set-индекс почти ничего не отсекает.'
- id: q10
  section: main
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: Дедупликация и мутации
  text:
    ru: '`DELETE FROM events WHERE user_id = 42` fails with `Code 344 SUPPORT_IS_DISABLED` because `events` has a projection. You must keep the projection and use the lightweight `DELETE` statement. What should you do?'
  options:
  - text:
      ru: Run `ALTER TABLE events MODIFY SETTING lightweight_mutation_projection_mode = 'rebuild'`, then repeat the `DELETE`
    correct: true
  - text:
      ru: Append `SETTINGS lightweight_mutation_projection_mode = 'rebuild'` to the `DELETE` statement itself and run it again
    correct: false
  - text:
      ru: Run `OPTIMIZE TABLE events FINAL`, then repeat the `DELETE`
    correct: false
  - text:
      ru: Run `ALTER TABLE events DROP PROJECTION …`, then repeat the `DELETE` and recreate the projection afterwards
    correct: false
  hints:
    ru:
    - Режим работы лёгкого удаления с проекциями — это настройка таблицы, а не запроса.
  explanation:
    ru: 'D5 Dedup and mutations (5.1) × D4 (4.3). По умолчанию `lightweight_mutation_projection_mode = ''throw''`, и `DELETE` на таблице с проекциями отклоняется. Решение — сменить режим в настройках таблицы (`rebuild` пересобирает проекции, `drop` удаляет их из затронутых кусков). Проверено на 26.11: `SETTINGS` в самом `DELETE` ошибку не снимает (тот же Code 344), а после `ALTER … MODIFY SETTING` удаление проходит. Вариант Г нарушает условие «сохранить проекцию», а `OPTIMIZE` на режим не влияет.'
- id: q11
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: Дедупликация и мутации
  text:
    ru: Table `users` receives a new row with the current `updated_at` on every profile change. Queries must return only the latest row per `id` immediately, without waiting for background merges. Which definition and query do this?
  options:
  - text:
      ru: '`ENGINE = ReplacingMergeTree ORDER BY (id, updated_at)`, query `SELECT * FROM users`'
    correct: false
  - text:
      ru: '`ENGINE = ReplacingMergeTree(updated_at) ORDER BY id`, query `SELECT * FROM users`'
    correct: false
  - text:
      ru: '`ENGINE = ReplacingMergeTree(updated_at) ORDER BY id`, query `SELECT * FROM users FINAL`'
    correct: true
  - text:
      ru: '`ENGINE = ReplacingMergeTree(id) ORDER BY updated_at`, query `SELECT * FROM users FINAL`'
    correct: false
  hints:
    ru:
    - Дубликаты определяются по ключу сортировки, а выбор победителя — по колонке версии.
  explanation:
    ru: 'D5 Dedup and mutations (5.2). `ReplacingMergeTree(ver)` оставляет при слиянии строку с наибольшей версией среди строк с одинаковым ключом сортировки, но слияния асинхронны, поэтому до них нужен `FINAL`. В варианте А `updated_at` входит в ключ, и строки с разным временем не считаются дубликатами (проверено: `FINAL` вернул обе строки). В Б без `FINAL` запрос видит обе версии (проверено). В Г ключ и версия перепутаны местами. `FINAL` удобно сочетать с `WHERE` по колонкам ключа, чтобы не читать лишнее.'
- id: q12
  section: main
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: Дедупликация и мутации
  text:
    ru: Table `balances (id UInt64, v UInt32, sign Int8)` uses `CollapsingMergeTree(sign) ORDER BY id` and contains the row `(1, 10, 1)`. You must change `v` to 20 so that `SELECT id, sum(v * sign) FROM balances GROUP BY id` returns 20. Which `INSERT` do you run?
  options:
  - text:
      ru: '`INSERT INTO balances VALUES (1, 20, 1)`'
    correct: false
  - text:
      ru: '`INSERT INTO balances VALUES (1, 10, -1), (1, 20, 1)`'
    correct: true
  - text:
      ru: '`INSERT INTO balances VALUES (1, 20, -1)`'
    correct: false
  - text:
      ru: '`INSERT INTO balances VALUES (1, 10, 1), (1, 20, -1)`'
    correct: false
  hints:
    ru:
    - Строка отмены должна повторять старое состояние со знаком −1, затем идёт новое состояние со знаком +1.
    - 'Проверьте суммы: 10 − 10 + 20.'
  explanation:
    ru: 'D5 Dedup and mutations (5.3). В `CollapsingMergeTree` «обновление» — это пара строк: отмена старого состояния (те же значения, `sign = -1`) и новое состояние (`sign = 1`). Тогда `sum(v * sign) = 10 − 10 + 20 = 20` и до, и после слияний; для строк «как есть» используют `FINAL`. Остальные варианты дают А: 30, В: −10, Г: 0 (в Г знаки перевёрнуты, и `FINAL` показал бы устаревшее `(1, 10, 1)`). Проверено на 26.11. Если отмена и состояние могут прийти в разных пакетах не по порядку, `FINAL` на `CollapsingMergeTree` ведёт себя неверно, и надёжнее `VersionedCollapsingMergeTree`.'
