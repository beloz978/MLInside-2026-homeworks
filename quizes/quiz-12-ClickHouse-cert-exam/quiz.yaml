  options:
  - text:
      ru: It guarantees that no two rows have the same key value
    correct: false
  - text:
      ru: It is a dense index with one entry for every row
    correct: false
  - text:
      ru: It must always be different from the `ORDER BY` expression
    correct: false
  - text:
      ru: It is a sparse index with one entry per granule (8192 rows by default)
    correct: true
  hints:
    ru: []
  explanation:
    ru: 'D1 Modeling (1.3). Первичный ключ MergeTree — разреженный индекс: одна запись на гранулу (по умолчанию 8192 строки), он ускоряет чтение, но не обеспечивает уникальность. Если `PRIMARY KEY` не задан, он совпадает с `ORDER BY`; если задан, он обязан быть префиксом ключа сортировки.'
