  explanation:
    ru: 'D4 Optimizing (4.3). Только `EXPLAIN` показывает, что оптимизатор выбрал проекцию: в плане источник называется `ReadFromMergeTree (by_user)` вместо `ReadFromMergeTree (default.p)` (проверено на 26.11). `system.projections` лишь подтверждает, что проекция существует, а `DESCRIBE` и `CHECK TABLE` вообще не касаются плана.'
- id: r5
  section: reserve
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: Оптимизация
  text:
    ru: Table `sm` is `SummingMergeTree ORDER BY day` with columns `(day Date, n UInt64)`. Two separate inserts put `('2026-10-01', 1)` and `('2026-10-01', 2)` into it. Which query is guaranteed to return 3 for that day at any moment?
  options:
  - text:
      ru: '`SELECT day, n FROM sm`'
    correct: false
  - text:
      ru: '`SELECT day, any(n) FROM sm GROUP BY day`'
    correct: false
  - text:
      ru: '`SELECT day, n FROM sm ORDER BY day LIMIT 1 BY day`'
    correct: false
  - text:
      ru: '`SELECT day, sum(n) FROM sm GROUP BY day`'
    correct: true
  hints:
    ru:
    - Строки суммируются лишь при фоновых слияниях.
  explanation:
    ru: 'D4 Optimizing (4.2). `SummingMergeTree` суммирует строки с одинаковым ключом только при слиянии, поэтому до него в таблице лежат обе строки (проверено: `SELECT * FROM sm` вернул 2 и 1). Корректный запрос всегда повторяет `sum()` и `GROUP BY`. Остальные варианты возвращают произвольную из строк.'
- id: r6
  section: reserve
