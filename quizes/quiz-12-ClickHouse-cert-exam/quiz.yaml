  options:
  - text:
      ru: '`SELECT cat, item, n FROM sales ORDER BY n DESC LIMIT 3 GROUP BY cat`'
    correct: false
  - text:
      ru: '`SELECT cat, item, n FROM sales ORDER BY cat, n DESC LIMIT 3`'
    correct: false
  - text:
      ru: '`SELECT cat, item, n FROM sales ORDER BY cat, n DESC LIMIT 3 BY cat`'
    correct: true
  - text:
      ru: '`SELECT cat, item, n FROM sales WHERE row_number() <= 3 PARTITION BY cat`'
    correct: false
  hints:
    ru:
    - В ClickHouse есть отдельная конструкция «первые N строк в каждой группе».
  explanation:
    ru: 'D3 Analyzing (3.2). `LIMIT n BY колонка` оставляет первые n строк для каждого значения колонки после сортировки (проверено: по 2 лучших строки в каждой категории). Обычный `LIMIT 3` ограничивает весь результат; `LIMIT … GROUP BY` и `WHERE row_number()` — несуществующий синтаксис.'
