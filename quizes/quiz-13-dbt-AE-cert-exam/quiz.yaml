  explanation:
    ru: 'D1. Рекомендуемая структура: staging — по одной модели на таблицу источника с лёгкой очисткой (переименование, приведение типов), при необходимости intermediate для сложной логики, и marts — бизнес-сущности и витрины. Так логика не дублируется, а граф остаётся читаемым; остальные варианты нарушают направление зависимостей или смешивают слои.'
- id: q65
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D1 · Choosing a materialization
  text:
    ru: A mart is read by BI dashboards hundreds of times per day. It joins several tables with about 500 million rows, and its data changes only after the nightly load. How should you materialize it?
  options:
  - text:
      ru: As a `view`, so that every dashboard query sees the latest source data
    correct: false
  - text:
      ru: As `ephemeral`, so that the joins are inlined into every dashboard query
    correct: false
  - text:
      ru: As a `table`, rebuilt once after the nightly load
    correct: true
  - text:
      ru: As a `snapshot`, so that every nightly run keeps a copy of the mart
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D1. Дорогие соединения, частое чтение и редкое обновление — случай для `table` (или incremental, если данных много): расчёт выполняется один раз, а дашборды читают готовый результат. `view` пересчитывал бы соединения при каждом запросе, `ephemeral` вообще не создаёт объект, а `snapshot` нужен для истории изменений источника.'
