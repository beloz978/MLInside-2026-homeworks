langs:
- ru
title:
  ru: Тест 13. dbt Analytics Engineering Certification (cert exam)
meta:
  ru:
    audience: Data engineers и аналитики, готовящиеся к dbt Analytics Engineering Certification (dbt Core 1.11)
    purpose: 'Полноразмерный пробный экзамен dbt AE: 65 сценарных вопросов на английском с разбором на русском, формат и время как на экзамене'
    goal: Выбирать конфигурацию, команду или тест dbt под задачу — incremental и microbatch, snapshots, contracts и versions, unit и data tests, отладка, source freshness, state и slim CI
    context: 'Study guide dbt 1.11, семь доменов (веса dbt Labs не публикует); экзамен: 65 вопросов, 120 минут, проходной балл 65%; проект MyCerts; материалы сессии — в каталоге session/'
    prerequisites: SQL, 6+ месяцев работы с dbt (models, ref/source, tests, incremental)
    duration_min: 120
questions:
- id: q1
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D1 · Incremental strategies
  text:
    ru: Your `fct_orders` model runs on Snowflake and holds about 200 million rows. Each night the source delivers new orders and orders whose status changed; `order_id` is unique. You want each nightly run to process only new and changed rows and to keep exactly one row per order. What should you do?
  options:
  - text:
      ru: Materialize the model as `table`, so that every run rebuilds it from the full source data
    correct: false
  - text:
      ru: Use an incremental model with `incremental_strategy='append'` and filter on the last update time
    correct: false
  - text:
      ru: Use an incremental model with `unique_key='order_id'` and filter on the last update time
    correct: true
  - text:
      ru: Materialize the model as `ephemeral` and let the downstream models select from it
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D1. Incremental с `unique_key` на Snowflake по умолчанию использует стратегию `merge`: новые строки вставляются, изменённые обновляются по `order_id`. `append` только добавляет строки и даст дубликаты изменённых заказов. `table` работает, но каждый раз пересчитывает все 200 млн строк, а `ephemeral` вообще не создаёт объект в хранилище (модель встраивается как CTE).'
- id: q2
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D5 · Unit tests
  text:
    ru: The `stg_vacancies` model parses free-text salary strings with CASE expressions and regex into `salary_min` and `salary_max`. Before merging a change, you want to verify the parsing logic on a few hand-written inputs, including edge cases that do not exist in production data yet. What should you do?
  options:
  - text:
      ru: Write a singular test that selects rows from the production table where `salary_min > salary_max`
    correct: false
  - text:
      ru: Add an `accepted_values` test on `salary_currency` in the properties file of the model
    correct: false
  - text:
      ru: Run `dbt source freshness` on the raw vacancies table before every deployment
    correct: false
  - text:
      ru: Define a `unit_tests` entry with mocked `given` rows and the expected rows in `expect`
    correct: true
  hints:
    ru: []
  explanation:
    ru: 'D5. Unit test (dbt 1.8+) описывается в YAML: `model`, `given` (mock-строки для `ref`/`source`) и `expect` (ожидаемый результат). Он проверяет логику SQL на заданных примерах, включая граничные случаи, и запускается `dbt test --select test_type:unit` (в `dbt build` — до сборки модели). Singular и generic data tests проверяют реальные данные уже после сборки, а source freshness проверяет только свежесть загрузки.'
- id: q3
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟨 применение
  topic:
    ru: D1 · --empty
  text:
    ru: You refactored a chain of 30 models and want to quickly confirm that all of them build with the expected columns and types, without reading production data and without paying for full table scans. What should you do?
  options:
  - text:
      ru: Run `dbt build --empty`
    correct: true
  - text:
      ru: Run `dbt compile` and read the compiled SQL files of the changed models
    correct: false
  - text:
      ru: Run `dbt run --full-refresh` against a development schema
    correct: false
  - text:
      ru: Run `dbt parse` and check that the command finishes without errors
    correct: false
  hints:
    ru: []
  explanation:
    ru: D1. `--empty` ограничивает `ref()` и `source()` нулём строк (`limit 0`), поэтому модели реально создаются в хранилище со своей схемой, но данные не читаются и стоимость минимальна. `compile` и `parse` в хранилище ничего не создают и не проверяют типы колонок, а `--full-refresh` пересчитает все данные.
- id: q4
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D3 · compiled vs run
  text:
    ru: 'A `dbt run` fails with `Database Error in model stg_vacancies: syntax error at or near "AS"`. The compiled SELECT looks fine, so you suspect the statement that dbt wraps around it for the materialization. Which file shows the exact statement that dbt sent to the warehouse, including the `create table ... as` wrapper?'
  options:
  - text:
      ru: '`models/staging/stg_vacancies.sql`'
    correct: false
  - text:
      ru: '`target/compiled/my_project/models/staging/stg_vacancies.sql`'
    correct: false
  - text:
      ru: '`target/run/my_project/models/staging/stg_vacancies.sql`'
    correct: true
  - text:
      ru: '`target/catalog.json`'
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D3. `target/compiled/` содержит SQL после рендера Jinja (только SELECT), а `target/run/` — полный запрос, отправленный в хранилище: с `create table ... as`, `merge` и т.п. Исходный `.sql` содержит ещё не отрендеренный Jinja, а `catalog.json` — метаданные из `dbt docs generate`, а не SQL. Подробности ошибки есть и в `logs/dbt.log`.'
- id: q5
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D2 · Model contracts
  text:
    ru: The `dim_employers` model is public and used by several BI dashboards. A recent change renamed one column and changed the type of another, and the dashboards broke. You want dbt to fail the build before the model is materialized whenever its output does not match the agreed columns and data types. What should you do?
  options:
  - text:
      ru: Add `not_null` and `unique` data tests to every column of the model in its properties file
    correct: false
  - text:
      ru: 'Set `contract: {enforced: true}` and declare every column with its `data_type` in YAML'
    correct: true
  - text:
      ru: 'Set `on_schema_change: sync_all_columns` in the config block of the model'
    correct: false
  - text:
      ru: 'Set `access: public` and assign the model to a `group` in the properties file'
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D2. С `contract.enforced: true` dbt сравнивает имена и типы колонок результата с описанием в YAML до создания объекта и падает при расхождении; для каждой колонки нужен `data_type`. Data tests проверяют значения уже после сборки, `on_schema_change` относится к incremental-моделям и меняет схему, а не защищает её, `access` и `group` управляют только тем, кто может делать `ref` на модель.'
- id: q6
  section: main
  multi: true
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: D1 · Microbatch
  text:
    ru: Your `events` source table holds five years of data (about 3 billion rows) with an `event_ts` column. You want dbt to process the data in independent daily batches, so that a failed day can be retried and one month can be reprocessed without touching other months. Which two actions should you take? (Choose two.)
  options:
  - text:
      ru: Configure `incremental_strategy='microbatch'` with `event_time='event_ts'`, `batch_size='day'`, and `begin`
    correct: true
  - text:
      ru: Add an `is_incremental()` filter on `max(event_ts)` inside the model SQL
    correct: false
  - text:
      ru: Set `unique_key='event_id'` and use the `delete+insert` strategy
    correct: false
  - text:
      ru: Re-run the model with `--event-time-start` and `--event-time-end` covering that month
    correct: true
  - text:
      ru: Run `dbt run --full-refresh --select` for the model
    correct: false
  hints:
    ru: []
  explanation:
    ru: D1. Microbatch делит модель на независимые батчи по `event_time` (`batch_size`, `begin`); каждый батч — отдельный запрос, и упавший батч можно повторить. Пересчёт месяца делается флагами `--event-time-start` / `--event-time-end`. Фильтр `is_incremental()` в microbatch-модели не нужен (dbt сам ограничивает входы по `event_time`), `delete+insert` с `unique_key` не режет данные на батчи по времени, а `--full-refresh` пересоберёт все пять лет.
- id: q7
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟩 понимание
  topic:
    ru: D5 · Custom generic tests
  text:
    ru: You need one reusable test, `is_positive`, that can be applied to many numeric columns from YAML (for example `salary_min` and `salary_max`). Where should you define it?
  options:
  - text:
      ru: In `tests/is_positive.sql` as a plain SELECT that returns the failing rows of one table and one column
    correct: false
  - text:
      ru: In `tests/generic/is_positive.sql` as a `{% test is_positive(model, column_name) %}` block
    correct: true
  - text:
      ru: In `seeds/is_positive.csv` with one row for each column that must be checked
    correct: false
  - text:
      ru: In `dbt_project.yml` under `vars`, as a SQL string with placeholders for table and column
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D5. Custom generic test — это блок `{% test имя(model, column_name) %}` в `tests/generic/` (или в macros); его подключают в `data_tests` любой колонки. SELECT в `tests/` — singular test: он привязан к конкретным таблице и колонке и запускается один раз. Seeds и `vars` тестами не являются.'
- id: q8
  section: main
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: D7 · Slim CI
  text:
    ru: CI builds each pull request into an empty schema. A PR changes only `int_orders`; `stg_orders` (upstream of it) and `fct_orders` (downstream of it) are unchanged. The production `manifest.json` is saved in `./prod-artifacts`. You want CI to build only the changed model and everything downstream of it, and to resolve unchanged upstream models to production. Which command should you run?
  options:
  - text:
      ru: '`dbt build --select state:modified+ --state ./prod-artifacts`'
    correct: false
  - text:
      ru: '`dbt build --select state:modified+ --defer --state ./prod-artifacts`'
    correct: true
  - text:
      ru: '`dbt build --select state:modified --defer --state ./prod-artifacts`'
    correct: false
  - text:
      ru: '`dbt build --select +state:modified --defer --state ./prod-artifacts`'
    correct: false
  hints:
    ru: []
  explanation:
    ru: D7. `state:modified+` выбирает изменённые узлы и всех их потомков, `--state` указывает каталог с артефактами prod, а `--defer` подставляет prod-объекты вместо не собранных в CI родителей. Без `--defer` (вариант А) `int_orders` не найдёт `stg_orders` в пустой схеме CI. Без `+` (В) пропадёт `fct_orders`. С `+` слева (Г) соберутся все предки, а потомки не попадут в выборку.
- id: q9
  section: main
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: D4 · Failure in the DAG
  text:
    ru: A nightly `dbt build` runs with default settings. The `not_null` test (severity `error`) on `stg_orders.order_id` fails. `fct_orders` depends on `stg_orders`; `dim_employers` sits in an unrelated branch of the DAG. What happens next?
  options:
  - text:
      ru: Nodes downstream of `stg_orders` are skipped, while the unrelated branch keeps building
    correct: true
  - text:
      ru: dbt stops immediately and rolls back all models that were already built in this run in the warehouse
    correct: false
  - text:
      ru: dbt builds all remaining nodes and reports the failed test only in the final summary
    correct: false
  - text:
      ru: dbt retries the failed test once and then continues with `fct_orders` if it passes
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D4. В `dbt build` тест — узел DAG: при его ошибке потомки не выполняются и получают статус SKIP, а несвязанные ветки продолжают собираться. Остановка всего запуска происходит только с `--fail-fast`, и даже тогда уже созданные объекты не откатываются. Автоматических повторов нет: упавшее и пропущенное перезапускают через `dbt retry`. Чтобы не блокировать потомков, тесту ставят `severity: warn`.'
- id: q10
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D6 · Source freshness
  text:
    ru: Your ingestion job loads the table `raw.vacancies` and stamps each row with `_loaded_at`. You want dbt to report a warning when no new rows arrived for 6 hours and an error after 24 hours. What should you do?
  options:
  - text:
      ru: Add a `not_null` test on `_loaded_at` in the source properties and run `dbt test` every morning
    correct: false
  - text:
      ru: Add `freshness` settings with the same thresholds to the source properties file, but run only `dbt run`, because it evaluates source freshness automatically after building the models
    correct: false
  - text:
      ru: Run `dbt build --select source:raw`, which checks the freshness of the selected sources
    correct: false
  - text:
      ru: 'Set `loaded_at_field` and `freshness` with `warn_after: {count: 6, period: hour}` and `error_after: {count: 24, period: hour}`, then run `dbt source freshness`'
    correct: true
  hints:
    ru: []
  explanation:
    ru: 'D6. Source freshness задаётся у source (или таблицы): `loaded_at_field` и `freshness` с `warn_after` / `error_after` в виде `{count: N, period: minute|hour|day}`; проверяется отдельной командой `dbt source freshness`, результат пишется в `sources.json`. `not_null` не измеряет возраст данных, а `dbt run` и `dbt build` свежесть источников не проверяют.'
- id: q11
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D1 · Config precedence
  text:
    ru: 'In `dbt_project.yml`, the folder `models/marts` sets `+materialized: view`. The properties file for `fct_vacancies` sets `config: {materialized: table}`, and the SQL file of the model starts with `{{ config(materialized=''incremental'') }}`. How will dbt materialize `fct_vacancies`?'
  options:
  - text:
      ru: As a view, because `dbt_project.yml` sets the default for the whole folder
    correct: false
  - text:
      ru: As a table, because the properties file overrides the config in the SQL file
    correct: false
  - text:
      ru: As an incremental model, because the `config()` block in the SQL file wins
    correct: true
  - text:
      ru: dbt raises a compilation error because the same config is set in three places
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D1. Приоритет конфигов: `config()` в `.sql` > `config:` в properties YAML > `dbt_project.yml`. Побеждает самый конкретный уровень, а повторное определение ошибкой не считается.'
- id: q12
  section: main
  multi: true
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D5 · Test severity and store_failures
  text:
    ru: A data test on `stg_vacancies.employer_id` currently fails the build whenever it finds any bad row. You want it to raise a warning for 1–10 failing rows, to fail the build above 10 rows, and to keep the failing rows in the warehouse for review. Which two actions should you take? (Choose two.)
  options:
  - text:
      ru: 'Set `warn_if: ">0"` and `error_if: ">10"` in the config of the test'
    correct: true
  - text:
      ru: 'Set `limit: 10` in the config of the test'
    correct: false
  - text:
      ru: 'Set `store_failures: true` in the config of the test'
    correct: true
  - text:
      ru: Run the build with the `--warn-error` flag
    correct: false
  - text:
      ru: Set a `where` clause that keeps only the first 10 rows
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D5. `warn_if` и `error_if` задают пороги числа упавших строк для предупреждения и ошибки, а `store_failures: true` сохраняет упавшие строки в таблицу (по умолчанию в схему `<target_schema>_dbt_test__audit`). `limit` ограничивает число строк, возвращаемых тестом, но не задаёт порог, `--warn-error` превращает предупреждения в ошибки, а `where` сужает проверяемые строки.'
- id: q13
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D3 · Flags
  text:
    ru: Your CI job must fail whenever dbt emits any warning, for example a deprecation warning, instead of only printing it. What should you do?
  options:
  - text:
      ru: Add `--fail-fast` to the dbt command in the CI job
    correct: false
  - text:
      ru: Add `--log-level debug` to the dbt command in the CI job
    correct: false
  - text:
      ru: Add `--no-partial-parse` to the dbt command in the CI job
    correct: false
  - text:
      ru: Add `--warn-error` to the dbt command in the CI job
    correct: true
  hints:
    ru: []
  explanation:
    ru: D3. `--warn-error` превращает предупреждения в ошибки (выборочно — через `--warn-error-options`). `--fail-fast` останавливает запуск на первой ошибке, но предупреждений не касается, `--log-level` меняет только подробность логов, `--no-partial-parse` отключает кеш разбора проекта.
- id: q14
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: D1 · Python models
  text:
    ru: Which statement about dbt Python models is correct?
  options:
  - text:
      ru: A `.py` file in `models/` returns a SQL string, which dbt wraps in `create view as` on any adapter that has a Python runtime
    correct: false
  - text:
      ru: Python models run on the machine that runs dbt and are supported on every adapter, including Postgres
    correct: false
  - text:
      ru: A Python model can be materialized as `view` or `ephemeral` but cannot call `dbt.ref()` for its inputs
    correct: false
  - text:
      ru: A `.py` file defines `model(dbt, session)` and returns a DataFrame; only `table` and `incremental` are allowed
    correct: true
  hints:
    ru: []
  explanation:
    ru: D1. Python-модель — файл `.py` в `models/` с функцией `model(dbt, session)`, которая возвращает DataFrame; внутри доступны `dbt.ref()`, `dbt.source()` и `dbt.config()`. Код выполняется в среде хранилища (Snowpark, Databricks, BigQuery), поэтому поддерживаются не все адаптеры, а материализации — только `table` и `incremental`.
- id: q15
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟩 понимание
  topic:
    ru: D2 · Model versions
  text:
    ru: 'The `dim_employers` model is defined with versions v1 and v2, and `latest_version: 2` is set in its properties file. A downstream model uses `{{ ref(''dim_employers'') }}` without a version. Which version does it read?'
  options:
  - text:
      ru: v1, because unversioned references stay on the first version until they are changed by hand
    correct: false
  - text:
      ru: v2, because an unversioned `ref` resolves to `latest_version`
    correct: true
  - text:
      ru: Both versions, because dbt unions all versions of a model into a single relation
    correct: false
  - text:
      ru: None; dbt raises an error until the reference specifies `v=` explicitly
    correct: false
  hints:
    ru: []
  explanation:
    ru: D2. Без явной версии `ref` указывает на `latest_version` (если она не задана — на наибольший номер версии). Чтобы остаться на старой версии, пишут `ref('dim_employers', v=1)`, а у v1 задают `deprecation_date`, чтобы потребители увидели предупреждение и мигрировали.
- id: q16
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: D1 · Materializations
  text:
    ru: A model is configured as `ephemeral`. What happens to it when `dbt run` executes?
  options:
  - text:
      ru: dbt creates a temporary table and drops it at the end of the run in the target schema
    correct: false
  - text:
      ru: dbt creates no object; the SQL is inlined as a CTE into models that `ref` it
    correct: true
  - text:
      ru: dbt creates a view with the suffix `__dbt_tmp` in the target schema
    correct: false
  - text:
      ru: dbt skips the model unless it is selected explicitly with `--select`
    correct: false
  hints:
    ru: []
  explanation:
    ru: 'D1. `ephemeral`-модель не создаёт объект в хранилище: dbt подставляет её SELECT как CTE в модели, которые на неё ссылаются. Поэтому её нельзя запросить напрямую (например, из BI). Временные объекты с суффиксом `__dbt_tmp` (например, `fct_orders__dbt_tmp`) dbt использует внутри других материализаций, а пропуск модели без `--select` не связан с `ephemeral`.'
- id: q17
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟩 понимание
  topic:
    ru: D5 · relationships
  text:
    ru: You need to guarantee that every `employer_id` in `fct_vacancies` exists in `dim_employers`. Which generic test should you define?
  options:
  - text:
      ru: '`unique` on `fct_vacancies.employer_id`'
    correct: false
  - text:
      ru: '`relationships` on `dim_employers.employer_id` with `to: ref(''fct_vacancies'')` and `field: employer_id` in the model properties'
    correct: false
  - text:
      ru: '`relationships` on `fct_vacancies.employer_id` with `to: ref(''dim_employers'')` and `field: employer_id`'
    correct: true
  - text:
      ru: '`accepted_values` on `fct_vacancies.employer_id` with the full list of employer ids'
    correct: false
  hints:
    ru: []
