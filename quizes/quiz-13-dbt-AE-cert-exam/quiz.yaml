- id: q61
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: D1 · Macros and DRY
  text:
    ru: The same `CASE` expression that normalizes a status column is copied into 12 models, and the column has different names in different models. How do you follow the DRY principle?
  options:
  - text:
      ru: Move the expression into an `ephemeral` model and join it to every model, then rename the columns in each join
    correct: false
  - text:
      ru: Store the expression in a seed and read it with `ref()` in each model
    correct: false
  - text:
      ru: Put the expression into a string in `vars` and paste it in each model
    correct: false
  - text:
      ru: Write a Jinja macro in `macros/` and call it with the column name in each model
    correct: true
  hints:
    ru: []
  explanation:
    ru: D1. Выражение, применяемое к разным колонкам, оформляют макросом Jinja в `macros/` и вызывают `{{ normalize_status('status') }}`. Ephemeral-модель возвращает набор строк, а не выражение, seed хранит данные, а строка в `vars` не параметризуется колонкой и усложняет чтение кода.
- id: q62
  section: main
  multi: true
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: D5 · Unit test details
  text:
    ru: Which two statements about dbt unit tests are true? (Choose two.)
  options:
  - text:
      ru: In `given`, you may specify only the columns that the model under test uses
    correct: true
  - text:
      ru: '`expect` may list only the columns that you want to compare'
    correct: true
  - text:
      ru: Unit tests read their input rows from the production tables of the warehouse
    correct: false
  - text:
      ru: Unit tests are supported for Python models in the same way as for SQL models
    correct: false
  - text:
      ru: In `dbt build`, a unit test runs after the model it tests has been built
    correct: false
  hints:
    ru: []
  explanation:
    ru: D5. В `given` достаточно колонок, которые использует модель, а в `expect` — тех, что нужно сравнить; остальные можно не указывать. Данные для unit-теста берутся из моков в YAML, а не из таблиц, тесты поддерживаются для SQL-моделей, а `dbt build` запускает unit-тест до сборки модели, чтобы не материализовать модель с неверной логикой.
