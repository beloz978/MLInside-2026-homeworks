  text:
    ru: You want to preview 10 rows of the query behind `stg_vacancies` without materializing anything in the warehouse. Which command should you use?
  options:
  - text:
      ru: '`dbt run --select stg_vacancies --limit 10` in a scratch schema'
    correct: false
  - text:
      ru: '`dbt compile --select stg_vacancies`'
    correct: false
  - text:
      ru: '`dbt docs serve`'
    correct: false
  - text:
      ru: '`dbt show --select stg_vacancies --limit 10`'
    correct: true
  hints:
    ru: []
  explanation:
    ru: D1. `dbt show` выполняет запрос модели и выводит строки в терминал, ничего не создавая в хранилище; `--limit` ограничивает число строк. `dbt run` материализует модель и флага `--limit` не имеет, `compile` только рендерит SQL, а `docs serve` запускает сайт документации.
