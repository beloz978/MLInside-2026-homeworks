    ru: 'D7 · result: selector'
  text:
    ru: The `run_results.json` of last night's failed run was saved to `./last_run`. From another machine, you want to run the models that failed together with all their descendants, using `./last_run` as the state. Which command should you use?
  options:
  - text:
      ru: '`dbt build --select result:error+ --state ./last_run`'
    correct: true
  - text:
      ru: '`dbt build --select state:modified+ --state ./last_run`'
    correct: false
  - text:
      ru: '`dbt build --select result:warn+ --state ./last_run`'
    correct: false
  - text:
      ru: '`dbt build --select source_status:fresher+ --state ./last_run`'
    correct: false
  hints:
    ru: []
  explanation:
    ru: D7. Селектор `result:<статус>` выбирает узлы по статусу в `run_results.json` из каталога `--state`; `result:error+` — упавшие узлы и их потомки. `state:modified` сравнивает код и конфиги, а не статусы, `result:warn` выбирает предупреждения, а `source_status` работает с результатами `dbt source freshness`.
- id: q58
