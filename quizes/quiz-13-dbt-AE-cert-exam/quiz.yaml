    ru: []
  explanation:
    ru: D5. Тесты можно объявлять и на источниках, а запускать их через `dbt test --select source:<имя>`. `dbt source freshness` проверяет возраст данных, а не тесты, `dbt run` выполняет только модели, а `--exclude` убирает узлы, а не выбирает их.
- id: q59
