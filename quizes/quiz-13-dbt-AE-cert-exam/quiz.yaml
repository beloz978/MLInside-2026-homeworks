  text:
    ru: Which layering of models follows dbt project structure best practices?
  options:
  - text:
      ru: Marts read raw tables, and staging models are built on top of the marts
    correct: false
  - text:
      ru: One large model per mart reads the sources directly and contains all the logic of the business rules
    correct: false
  - text:
      ru: Staging models join several sources and aggregate them for the business users
    correct: false
