- id: q26
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S3 Data pipeline orchestration
  text:
    ru: You are migrating 200 existing Apache Airflow DAGs from an on-premises server. The DAGs coordinate Dataproc, BigQuery, and Cloud Storage tasks with retries and backfills. You want to minimize code changes. Which service should you use?
  options:
  - text:
      ru: Workflows
    correct: false
  - text:
      ru: BigQuery scheduled queries
    correct: false
  - text:
      ru: Cloud Composer
    correct: true
  - text:
      ru: Dataproc Workflow Templates
    correct: false
  hints:
    ru: []
