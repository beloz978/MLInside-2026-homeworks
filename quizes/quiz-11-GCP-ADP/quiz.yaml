    ru: 'S3 (3.2). Cloud Composer — управляемый Airflow: DAG переносятся почти без изменений, есть операторы GCP, retries и backfill. Workflows и шаблоны Dataproc потребуют переписать логику; scheduled queries не оркестрируют разные сервисы.'
- id: q27
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: S4 Data management
  text:
    ru: A bucket with Object Versioning enabled keeps growing. You must delete objects older than 365 days and noncurrent versions 30 days after they become noncurrent, automatically. What should you do?
  options:
  - text:
      ru: Write a Cloud Run job that lists and deletes old objects daily
    correct: false
  - text:
      ru: 'Add lifecycle rules: Delete when age is 365 days, and Delete when daysSinceNoncurrentTime is 30'
    correct: true
  - text:
      ru: Set a retention policy of 365 days
    correct: false
  - text:
      ru: Disable Object Versioning
    correct: false
  hints:
    ru: []
  explanation:
    ru: S4 (4.2). Object Lifecycle Management удаляет объекты по условиям age и daysSinceNoncurrentTime без своего кода. Retention policy наоборот запрещает удаление, отключение versioning не удаляет старые версии.
- id: q28
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: A Dataflow pipeline exchanges records with other teams through Cloud Storage. Records are written and consumed one row at a time, producers often add optional fields, and consumers must read old and new files without failures. You need a compact binary format with an embedded schema. Which format should you choose?
  options:
  - text:
      ru: CSV with a header row
    correct: false
  - text:
      ru: JSON Lines
    correct: false
  - text:
      ru: Apache Avro
    correct: true
  - text:
      ru: Apache Parquet
    correct: false
  hints:
    ru:
    - Важны построчная запись и эволюция схемы, а не чтение отдельных колонок.
  explanation:
    ru: 'S1 (1.2). Avro — строчный бинарный формат со схемой в файле и правилами эволюции (новые поля с default). Parquet колоночный: удобен для аналитики, но неудобен для построчной записи. CSV и JSON без бинарного сжатия и схемы.'
- id: q29
