- id: q30
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: S4 Data management
  text:
    ru: Tables in the `staging` BigQuery dataset are temporary and must be deleted automatically 7 days after creation. What should you do?
  options:
  - text:
      ru: Set a default table expiration of 7 days on the `staging` dataset
    correct: true
  - text:
      ru: Set a partition expiration of 7 days on each table
