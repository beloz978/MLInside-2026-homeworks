- id: q37
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S3 Data pipeline orchestration
  text:
    ru: When a partner uploads a file to a Cloud Storage bucket, a Cloud Run service must start processing it immediately. You want an event-driven solution with no polling. What should you do?
  options:
  - text:
      ru: Schedule Cloud Scheduler to call the service every minute to list new files
    correct: false
  - text:
      ru: Create an Eventarc trigger on the `google.cloud.storage.object.v1.finalized` event that targets the Cloud Run service
    correct: true
  - text:
