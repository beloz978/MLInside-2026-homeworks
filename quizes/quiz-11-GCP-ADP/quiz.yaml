- id: q34
  section: main
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: S4 Data management
  text:
    ru: Regulations require that trade records be stored for 7 years in a way that nobody, including administrators, can delete or overwrite them before the period ends. The records are almost never read. What should you do?
  options:
  - text:
      ru: Store the records in an Archive class bucket with Object Versioning enabled
    correct: false
  - text:
      ru: Store the records in BigQuery and restrict the Data Editor role
    correct: false
  - text:
      ru: Store the records in a Coldline bucket and remove delete permissions from all users
    correct: false
  - text:
      ru: Store the records in an Archive class bucket with a 7-year retention policy, and lock the policy
    correct: true
  hints:
    ru: []
  explanation:
    ru: 'S4 (4.2). Bucket Lock (заблокированная retention policy) — WORM: объект нельзя удалить или перезаписать до конца срока, и саму политику уже нельзя ослабить. Archive — самый дешёвый класс для почти не читаемых данных. Versioning и IAM администратор может изменить.'
- id: q35
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: Your company must move 400 TB of archived data from an on-premises data center to Cloud Storage within four weeks. The data center has a shared 100 Mbps internet connection that cannot be saturated. What should you do?
