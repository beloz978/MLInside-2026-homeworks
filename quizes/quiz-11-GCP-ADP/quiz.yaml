langs:
- ru
title:
  ru: Тест 11. Google Cloud Associate Data Practitioner (ADP) — пробный экзамен
meta:
  ru:
    audience: Data engineers, готовящиеся к Google Cloud Associate Data Practitioner (ADP)
    purpose: 'Пробный экзамен ADP в условиях, максимально близких к реальным: 60 сценарных вопросов на английском, разбор на русском'
    goal: Выбирать сервис или настройку GCP по бизнес-ограничениям (стоимость, ops-нагрузка, задержка, безопасность) во всех четырёх доменах exam guide v1.0
    context: 'Exam guide v1.0: 50–60 вопросов, 2 часа, домены S1 30% · S2 27% · S3 18% · S4 25%. Создан в проекте MyCerts; история создания, промпты и решения — в context/'
    prerequisites: 6+ месяцев работы с данными в Google Cloud (рекомендация Google)
    duration_min: 120
questions:
- id: q1
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: Your company receives daily CSV and Parquet files from 12 suppliers. New files are read several times during the first week; files older than 90 days are rarely read but must be kept for two years for reprocessing. You need to keep the original files unmodified at the lowest overall cost. What should you do?
  options:
  - text:
      ru: Store all files in a Cloud Storage bucket with the Archive class from the moment they arrive
    correct: false
  - text:
      ru: Load the files into BigQuery and rely on time travel to recover earlier versions
    correct: false
  - text:
      ru: Keep the files on a Persistent Disk and take daily snapshots
    correct: false
  - text:
      ru: Store the files in Cloud Storage with a lifecycle rule moving objects older than 90 days to Coldline
    correct: true
  hints:
    ru:
    - Сравните, как часто читают свежие и старые файлы, и сколько стоит чтение из «холодных» классов.
  explanation:
    ru: S1/S4 (1.2, 4.2). Свежие файлы читают часто — им нужен Standard, а после 90 дней подходит Coldline (минимальный срок хранения 90 дней, плата за чтение невелика при редком доступе). Archive с первого дня даёт плату за каждое чтение в первую неделю. Time travel в BigQuery хранит максимум 7 дней, Persistent Disk дороже и не масштабируется как хранилище файлов.
- id: q2
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S2 Data analysis and presentation
  text:
    ru: Your `events` table grows by 50 GB per day. Events can arrive up to three days after they occur. Most queries filter on the date the event occurred and cover the last seven days. You want to minimize query costs. How should you design the table?
  options:
  - text:
      ru: Use ingestion-time partitioning and filter on `_PARTITIONTIME`
    correct: false
  - text:
      ru: Use integer-range partitioning on `store_id`
    correct: false
  - text:
      ru: Partition by day on `DATE(event_timestamp)`
    correct: true
  - text:
      ru: Create a table per day (`events_20261006`) and query with wildcard tables
    correct: false
  hints:
    ru:
    - По какому полю фильтруют запросы и куда попадёт событие, пришедшее через три дня?
  explanation:
    ru: S2 (2.1). Партиция по дате события совпадает с фильтром запросов, и опоздавшее событие попадает в свою дату. Ingestion-time положит его в день загрузки, и фильтр по дате события не отсечёт партиции. Шардирование по дням — антипаттерн (лимиты, метаданные, нет единой схемы). store_id не совпадает с фильтром.
- id: q3
  section: main
  multi: true
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S4 Data management
  text:
    ru: An analyst must run queries in project `analytics-prj` and read tables only in the `sales` dataset. Following the principle of least privilege, which two roles should you grant? (Choose two.)
  options:
  - text:
      ru: BigQuery Job User on the project
    correct: true
  - text:
      ru: BigQuery Admin on the project
    correct: false
  - text:
      ru: BigQuery Data Viewer on the `sales` dataset
    correct: true
  - text:
      ru: Editor on the project
    correct: false
  - text:
      ru: BigQuery Data Editor on the project
    correct: false
  hints:
    ru: []
  explanation:
    ru: S4 (4.1). Job User разрешает запускать запросы, Data Viewer на датасете — читать только его таблицы. Admin, Editor и Data Editor на проекте дают лишние права (запись, все датасеты, другие сервисы).
- id: q4
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟨 применение
  topic:
    ru: S3 Data pipeline orchestration
  text:
    ru: A mobile app publishes JSON clickstream events to a Pub/Sub topic. The message fields match the target BigQuery table, and no transformation is required. You need to write the events to BigQuery with the lowest operational overhead. What should you do?
  options:
  - text:
      ru: Create a BigQuery subscription on the topic that writes by using the table schema
    correct: true
  - text:
      ru: Deploy the Dataflow "Pub/Sub to BigQuery" template
    correct: false
  - text:
      ru: Write a Cloud Run function that inserts each event with the Storage Write API
    correct: false
  - text:
      ru: Consume a pull subscription from a managed instance group on Compute Engine
    correct: false
  hints:
    ru: []
  explanation:
    ru: S3 (3.2). BigQuery subscription пишет сообщения прямо в таблицу — нет пайплайна, который надо запускать и мониторить. Dataflow-шаблон тоже работает, но это отдельные воркеры и задание. Cloud Run и Compute Engine — свой код и инфраструктура.
- id: q5
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: A vendor writes new files to an Amazon S3 bucket every night. You need to copy only new or changed files to Cloud Storage once a day, with minimal custom code and no infrastructure to maintain. What should you do?
  options:
  - text:
      ru: Write a Cloud Run job that runs `gcloud storage rsync`, triggered by Cloud Scheduler
    correct: false
  - text:
      ru: Create a daily Storage Transfer Service job from S3 to Cloud Storage
    correct: true
  - text:
      ru: Order a Transfer Appliance and ship it to the vendor every month
    correct: false
  - text:
      ru: Create a BigQuery Data Transfer Service transfer from S3 into BigQuery
    correct: false
  hints:
    ru: []
  explanation:
    ru: S1 (1.1). Storage Transfer Service — управляемый перенос S3 → GCS по расписанию, копирует только новые и изменённые объекты. Cloud Run + rsync работает, но это свой код. BigQuery DTS из S3 грузит в таблицу BigQuery, а не в bucket. Transfer Appliance — для разовых переносов сотен терабайт.
- id: q6
  section: main
  multi: true
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S2 Data analysis and presentation
  text:
    ru: Analysts sometimes run queries without a date filter against a 30 TB date-partitioned table, which causes unexpected on-demand charges. You need to prevent full-table scans and limit how much each analyst can spend per day. Which two actions should you take? (Choose two.)
  options:
  - text:
      ru: Set a partition expiration of 90 days on the table
    correct: false
  - text:
      ru: Set `require_partition_filter` to TRUE on the table
    correct: true
  - text:
      ru: Enable BI Engine for the project
    correct: false
  - text:
      ru: Create a custom quota for query usage per day per user
    correct: true
  - text:
      ru: Re-create the table as an external table over Parquet files
    correct: false
  hints:
    ru:
    - Одно действие касается таблицы, другое — лимитов проекта.
  explanation:
    ru: S2/S4 (2.1, 4.1). `require_partition_filter` отклоняет запросы без фильтра по партиции, а custom quota «Query usage per day per user» ограничивает объём, который пользователь сканирует за день. Expiration удаляет данные, BI Engine ускоряет, но не ограничивает, external table не уменьшает сканирование.
- id: q7
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: S4 Data management
  text:
    ru: Your security team requires that access to a Cloud Storage bucket be controlled only through IAM, and object ACLs must not be used. What should you do?
  options:
  - text:
      ru: Enable uniform bucket-level access on the bucket
    correct: true
  - text:
      ru: Remove the `allUsers` ACL from each object
    correct: false
  - text:
      ru: Enable Object Versioning
    correct: false
  - text:
      ru: Set a retention policy on the bucket
    correct: false
  hints:
    ru: []
  explanation:
    ru: S4 (4.1). Uniform bucket-level access отключает ACL и оставляет только IAM. Удаление отдельных ACL не мешает добавить новые; versioning и retention к доступу не относятся.
- id: q8
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: Your application uses Cloud SQL for PostgreSQL. Analysts need the `orders` and `customers` tables in BigQuery, with inserts, updates, and deletes reflected within minutes. The solution must minimize load on the source database and require minimal custom code. What should you do?
  options:
  - text:
      ru: Query the source tables from dashboards with BigQuery federated queries (`EXTERNAL_QUERY`)
    correct: false
  - text:
      ru: Export the tables to CSV in Cloud Storage every hour and load them into BigQuery
    correct: false
  - text:
      ru: Create a Datastream stream from Cloud SQL for PostgreSQL to BigQuery
    correct: true
  - text:
      ru: Replicate to a second Cloud SQL instance with Database Migration Service and query it federatedly
    correct: false
  hints:
    ru:
    - Нужны изменения (включая DELETE) с задержкой в минуты и без нагрузки на источник.
  explanation:
    ru: S1 (1.2). Datastream читает логическую репликацию (CDC) и пишет в BigQuery с задержкой в минуты, почти не нагружая базу. EXTERNAL_QUERY нагружает источник каждым запросом дашборда. Почасовой экспорт CSV не даёт минутной задержки и теряет DELETE. Database Migration Service нужен для миграции базы, а не для аналитики.
- id: q9
  section: main
  multi: true
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: S3 Data pipeline orchestration
  text:
    ru: You must calculate per-store sales totals in 1-minute windows from a Pub/Sub stream, based on the time each sale occurred. About 10% of events arrive up to 5 minutes late and must be counted in the correct window. Results go to BigQuery. You want a managed, serverless solution. Which two actions should you take? (Choose two.)
  options:
  - text:
      ru: Build a Dataflow streaming pipeline with fixed event-time windows
    correct: true
  - text:
      ru: Enable message ordering on the Pub/Sub subscription
    correct: false
  - text:
      ru: Configure allowed lateness and triggers so late events update their window
    correct: true
  - text:
      ru: Use processing-time windows so late events go into the currently open window
    correct: false
  - text:
      ru: Run Spark Structured Streaming on a long-running Dataproc cluster
    correct: false
  hints:
    ru:
    - Окно должно определяться временем события, а не временем прихода; подумайте, что делать с опоздавшими.
  explanation:
    ru: S3 (3.1). Event-time окна в Dataflow + allowed lateness и триггеры — стандартное решение для опоздавших событий. Ordering keys упорядочивают доставку, но не возвращают опоздавшие события в прошлое окно. Processing-time окна кладут событие не в ту минуту. Dataproc — не serverless и требует управления кластером.
- id: q10
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟨 применение
  topic:
    ru: S2 Data analysis and presentation
  text:
    ru: Transaction timestamps are stored in a TIMESTAMP column, `transaction_ts`. The finance team in Tbilisi (UTC+4) reports revenue by local calendar day, and their daily totals do not match your report. Which expression should you use to group revenue by day?
  options:
  - text:
      ru: '`DATE(transaction_ts, ''Asia/Tbilisi'')`'
    correct: true
  - text:
      ru: '`DATE(transaction_ts)`'
    correct: false
  - text:
      ru: '`DATETIME(transaction_ts)`'
    correct: false
  - text:
      ru: '`TIMESTAMP_TRUNC(transaction_ts, DAY)`'
    correct: false
  hints:
    ru: []
  explanation:
    ru: S2 (2.1). TIMESTAMP хранит момент в UTC; `DATE(ts, tz)` берёт календарную дату в нужном часовом поясе. Без пояса `DATE` и `TIMESTAMP_TRUNC(…, DAY)` режут сутки по UTC, а `DATETIME` даёт не дату, а дату-время в UTC.
- id: q11
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S4 Data management
  text:
    ru: You must ensure that no bucket in any project of your organization can ever be made publicly accessible, including by project owners. What should you do?
  options:
  - text:
      ru: Grant Storage Admin only to the security team
    correct: false
  - text:
      ru: Enforce the `storage.publicAccessPrevention` organization policy constraint
    correct: true
  - text:
      ru: Enable uniform bucket-level access on existing buckets
    correct: false
  - text:
      ru: Audit bucket permissions weekly with Cloud Asset Inventory
    correct: false
  hints:
    ru: []
  explanation:
    ru: S4 (4.1). Org policy `storage.publicAccessPrevention` запрещает публичный доступ для всех текущих и будущих бакетов и не может быть отменена на уровне проекта. Роли и UBLA не мешают выдать `allUsers` через IAM, аудит только находит проблему постфактум.
- id: q12
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: You store three years of transaction history (about 40 TB) in Cloud Storage for occasional analysis from BigQuery and Spark. Most queries read 5–8 of the 60 columns. You want to minimize storage size and data scanned. Which file format should you use?
  options:
  - text:
      ru: CSV compressed with gzip
    correct: false
  - text:
      ru: Newline-delimited JSON
    correct: false
  - text:
      ru: Apache Avro
    correct: false
  - text:
      ru: Apache Parquet
    correct: true
  hints:
    ru: []
  explanation:
    ru: 'S1 (1.2). Parquet — колоночный формат: читаются только нужные колонки, сжатие лучше. Avro компактный и со схемой, но строчный — BigQuery читает из него все колонки. CSV и JSON — самые объёмные и без схемы.'
- id: q13
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟨 применение
  topic:
    ru: S2 Data analysis and presentation
  text:
    ru: Within each daily partition of a sales table, most queries filter on `customer_id` (about 2 million distinct values), and some also filter on `country`. You need to further reduce data scanned without changing the queries. What should you do?
  options:
  - text:
      ru: Change the table to integer-range partitioning on `customer_id`
    correct: false
  - text:
      ru: Cluster the table by `customer_id` and `country`
    correct: true
  - text:
      ru: Create a separate table for each country
    correct: false
  - text:
      ru: Create a logical view that filters on `customer_id`
    correct: false
  hints:
    ru: []
  explanation:
    ru: S2 (2.1). Кластеризация сортирует данные внутри партиций и позволяет пропускать блоки. Партиций может быть не больше 10 000, а 2 млн значений столько не дадут. Таблицы по странам потребуют менять запросы, logical view не уменьшает сканирование.
- id: q14
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S4 Data management
  text:
    ru: An external auditor without a Google account must download one report file from a private Cloud Storage bucket during the next 24 hours. What should you do?
  options:
  - text:
      ru: Make the object public and send its URL
    correct: false
  - text:
      ru: Grant `allUsers` the Storage Object Viewer role on the bucket
    correct: false
  - text:
      ru: Generate a signed URL for the object that expires in 24 hours
    correct: true
  - text:
      ru: Copy the file to a public bucket
    correct: false
  hints:
    ru: []
  explanation:
    ru: S4 (4.1). Signed URL даёт временный доступ к одному объекту без учётной записи Google. Публичный объект или бакет открывает данные всем и без срока.
- id: q15
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: S3 Data pipeline orchestration
  text:
    ru: Your team writes SQL transformations in BigQuery that depend on each other. They want dependency management, Git version control, and data assertions, without leaving BigQuery or managing infrastructure. Which tool should you use?
  options:
  - text:
      ru: Dataform
    correct: true
  - text:
      ru: Cloud Data Fusion
    correct: false
  - text:
      ru: Dataflow
    correct: false
  - text:
      ru: Dataproc
    correct: false
  hints:
    ru: []
  explanation:
    ru: S3 (3.1). Dataform — SQLX-модели в BigQuery с графом зависимостей, git и assertions (аналог dbt). Data Fusion — визуальный ETL, Dataflow и Dataproc — обработка кодом, а не управление SQL-моделями.
- id: q16
  section: main
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: Your team stores daily Parquet exports in Cloud Storage. Analysts query the latest 90 days many times per day from Looker Studio dashboards that must respond as fast as possible. The data is used only from BigQuery and is updated once per day. Only authorized users may see the `margin` column. What should you do?
  options:
  - text:
      ru: Create a BigLake table with metadata caching and apply a policy tag to `margin`
    correct: false
  - text:
      ru: Load the files daily into a partitioned native table and apply a policy tag to `margin`
    correct: true
  - text:
      ru: Create an external table over the files and share the dataset with the analysts
    correct: false
  - text:
      ru: Convert the files to ORC with Dataproc and query them with Spark SQL
    correct: false
  hints:
    ru:
    - Требованию безопасности отвечают два варианта; решает требование к скорости и то, что данные нужны только BigQuery.
  explanation:
    ru: S1/S4 (1.2, 4.1). Нативная партиционированная таблица — минимальная задержка, кеш результатов и BI Engine; policy tag закрывает колонку. BigLake тоже поддерживает policy tags и нужен, когда данные должны остаться в GCS для других движков, но он медленнее. Обычная external table не поддерживает column-level security. Spark SQL из дашборда — лишняя инфраструктура и задержка.
- id: q17
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S2 Data analysis and presentation
  text:
    ru: A Looker Studio dashboard runs the same SUM and COUNT by day and region every few minutes against an append-only 2 TB table that receives data continuously. You want lower latency and cost, always up-to-date results, and minimal maintenance. What should you do?
  options:
  - text:
      ru: Create a scheduled query that rebuilds a summary table every hour
    correct: false
  - text:
      ru: Create a logical view with the aggregation
    correct: false
  - text:
      ru: Export the aggregates to Cloud SQL every 15 minutes
    correct: false
  - text:
      ru: Create a materialized view with the aggregation
    correct: true
  hints:
    ru:
    - Решение должно быть одновременно свежим и не требовать обслуживания.
  explanation:
    ru: S2 (2.1). Materialized view обновляется инкрементально, а при запросе BigQuery добавляет ещё не учтённые строки, поэтому результат всегда актуален. Scheduled query отстаёт до часа, logical view не ускоряет, экспорт в Cloud SQL — лишний пайплайн и задержка.
- id: q18
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: Analysts need to run ad hoc SQL aggregations over 5 TB of sales history and join it with product data updated daily. The team does not want to manage indexes, servers, or capacity. Which storage solution should you use?
  options:
  - text:
      ru: Cloud SQL for PostgreSQL with two read replicas
    correct: false
  - text:
      ru: Bigtable
    correct: false
  - text:
      ru: Spanner
    correct: false
  - text:
      ru: BigQuery
    correct: true
  hints:
    ru: []
  explanation:
    ru: S1 (1.2). BigQuery — serverless-хранилище для аналитики. Cloud SQL и Spanner рассчитаны на транзакции, Bigtable — key-value без SQL-джойнов.
- id: q19
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S4 Data management
  text:
    ru: Your company wants to share curated BigQuery datasets with dozens of partner organizations. Partners must query the latest data from their own projects, without copies, and you want to manage subscriptions centrally. What should you do?
  options:
  - text:
      ru: Export the datasets to Cloud Storage and share the bucket
    correct: false
  - text:
      ru: Copy the datasets to each partner's project every night
    correct: false
  - text:
      ru: Email CSV extracts to the partners weekly
    correct: false
  - text:
      ru: Publish the datasets as listings in an Analytics Hub exchange
    correct: true
  hints:
    ru: []
  explanation:
    ru: 'S4 (4.1). Analytics Hub публикует listings: подписчик получает linked dataset в своём проекте, данные не копируются и всегда актуальны, издатель видит подписки. Экспорт, копии и CSV устаревают и плодят копии.'
- id: q20
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: S3 Data pipeline orchestration
  text:
    ru: Every morning you need to run one SQL statement that aggregates yesterday's orders into a summary table. There are no other dependencies. You want the simplest solution with the lowest cost. What should you do?
  options:
  - text:
      ru: Create a Cloud Composer environment with a daily DAG
    correct: false
  - text:
      ru: Create a BigQuery scheduled query
    correct: true
  - text:
      ru: Run a cron job on a Compute Engine VM that calls `bq query`
    correct: false
  - text:
      ru: Build a Dataflow batch pipeline triggered by Cloud Scheduler
    correct: false
  hints:
    ru: []
  explanation:
    ru: S3 (3.2). Scheduled query (на базе BigQuery DTS) — встроенное расписание одного запроса без инфраструктуры. Composer — постоянная среда и заметная стоимость, VM нужно обслуживать, Dataflow избыточен.
- id: q21
  section: main
  multi: false
  difficulty: простой
  level:
    ru: 🟩 понимание
  topic:
    ru: S2 Data analysis and presentation
  text:
    ru: A product dashboard shows daily active users from a 20-billion-row events table. Product managers accept a small statistical error in exchange for faster and cheaper queries. Which function should you use?
  options:
  - text:
      ru: '`APPROX_COUNT_DISTINCT(user_id)`'
    correct: true
  - text:
      ru: '`COUNT(DISTINCT user_id)`'
    correct: false
  - text:
      ru: '`COUNT(user_id)`'
    correct: false
  - text:
      ru: '`SUM(1)` with `GROUP BY user_id`'
    correct: false
  hints:
    ru: []
  explanation:
    ru: S2 (2.1). `APPROX_COUNT_DISTINCT` использует HyperLogLog++ и работает быстрее точного подсчёта с небольшой погрешностью. `COUNT(DISTINCT)` точный, но дороже; `COUNT(user_id)` считает события, а не пользователей.
- id: q22
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: Your team loads raw JSON order events into BigQuery staging tables every hour. Cleaning rules change often, and SQL-savvy analysts want to change the transformations themselves and reprocess history without reloading the source files. Which approach should you use?
  options:
  - text:
      ru: 'ETL: transform the events in Dataflow before loading them'
    correct: false
  - text:
      ru: 'ELT: keep raw data in BigQuery and transform it in SQL, for example with Dataform'
    correct: true
  - text:
      ru: 'ETL: clean the files in a Cloud Data Fusion pipeline before loading'
    correct: false
  - text:
      ru: Transform the events in the source application before publishing
    correct: false
  hints:
    ru:
    - Кто меняет логику и где лежат сырые данные для повторной обработки?
  explanation:
    ru: S1/S3 (1.1, 3.1). При ELT сырые данные уже в BigQuery, аналитики правят SQL и пересчитывают историю без повторной загрузки. В ETL-вариантах изменение логики требует правки пайплайна и повторного чтения исходных файлов.
- id: q23
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S4 Data management
  text:
    ru: Audit logs are written to Cloud Storage. They are read about once per quarter during audits and must be kept for one year. You want the lowest storage cost without retrieval penalties for that access pattern. Which storage class should you use?
  options:
  - text:
      ru: Standard
    correct: false
  - text:
      ru: Nearline
    correct: false
  - text:
      ru: Coldline
    correct: true
  - text:
      ru: Archive
    correct: false
  hints:
    ru: []
  explanation:
    ru: S4 (4.2). Coldline рассчитан на доступ реже раза в квартал (минимальный срок 90 дней). Nearline — для доступа раз в месяц и дороже в хранении, Archive — раз в год, с минимальным сроком 365 дней и самой дорогой выборкой.
- id: q24
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S2 Data analysis and presentation
  text:
    ru: A CDC feed writes every change of a customer record to `customer_changes` (`customer_id`, `updated_at`, and 30 other columns); `updated_at` is unique per customer. Analysts need only the latest version of each customer, with all columns. Which query should you use?
  options:
  - text:
      ru: '`SELECT DISTINCT * FROM customer_changes`'
    correct: false
  - text:
      ru: '`SELECT customer_id, MAX(updated_at) FROM customer_changes GROUP BY customer_id`'
    correct: false
  - text:
      ru: '`SELECT * FROM customer_changes QUALIFY ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY updated_at DESC) = 1`'
    correct: true
  - text:
      ru: '`SELECT * FROM customer_changes ORDER BY updated_at DESC LIMIT 1`'
    correct: false
  hints:
    ru:
    - Нужна одна строка на клиента и все колонки.
  explanation:
    ru: S2 (2.1). `ROW_NUMBER` с `QUALIFY` оставляет последнюю версию каждого клиента со всеми колонками. DISTINCT оставит все версии, GROUP BY вернёт только две колонки, LIMIT 1 — одну строку на всю таблицу.
