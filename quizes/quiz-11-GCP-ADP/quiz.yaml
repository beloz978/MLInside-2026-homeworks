- id: q32
  section: main
  multi: true
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: A supplier's daily files sometimes contain malformed records (invalid dates, missing required fields). Auditors require every received record to be retained, and the data team must be able to review and correct rejected records. Which two actions should you take? (Choose two.)
  options:
  - text:
      ru: Keep the original files unmodified in Cloud Storage
    correct: true
  - text:
      ru: Load directly into the reporting table with a high `max_bad_records` value
    correct: false
  - text:
      ru: Correct the records manually and overwrite the original files
    correct: false
  - text:
      ru: Write records that fail validation to a separate error table with the failure reason
    correct: true
  - text:
      ru: Load every column as STRING into the reporting table
    correct: false
  hints:
    ru:
    - Одно действие сохраняет исходные данные, другое делает ошибки видимыми.
  explanation:
    ru: S1 (1.1). Неизменный raw-слой выполняет требование аудита и позволяет переобработку, а dead-letter таблица с причиной ошибки даёт команде список для исправления. `max_bad_records` молча теряет строки, перезапись исходников нарушает аудит, всё в STRING переносит проблему в отчёты.
- id: q33
  section: main
