    ru: S1 (1.1). 100 Мбит/с — около 1 ТБ в сутки в идеале, то есть больше года на 400 ТБ. Transfer Appliance — физическое устройство для сотен терабайт за недели. Агенты STS и gcloud упираются в тот же канал, BigQuery DTS не переносит файлы с on-prem.
