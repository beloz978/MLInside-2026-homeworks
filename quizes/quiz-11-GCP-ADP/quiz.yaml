- id: q38
  section: main
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: S1 Data preparation and ingestion
  text:
    ru: Analytics jobs run in us-east1 and us-east4. Raw data in Cloud Storage must stay available if one region fails, and new objects must be replicated to the second region within 15 minutes. You want the lowest latency for compute in both regions. Which storage configuration should you use?
  options:
  - text:
      ru: A multi-region bucket in US
    correct: false
  - text:
      ru: A regional bucket in us-east1 with daily copies to us-east4 by Storage Transfer Service
    correct: false
  - text:
      ru: A dual-region bucket in us-east1 and us-east4 with turbo replication
    correct: true
  - text:
      ru: Zonal Persistent Disks in both regions replicated by a cron job
    correct: false
  hints:
    ru: []
  explanation:
    ru: S1/S4 (1.2, 4.3). Dual-region с выбранной парой регионов даёт низкую задержку из обоих регионов, а turbo replication гарантирует RPO 15 минут. Multi-region US не позволяет выбрать регионы и без turbo реплицирует до 12 часов. Ежедневное копирование не даёт 15 минут, диски — не хранилище объектов.
- id: q39
  section: main
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
  topic:
    ru: S4 Data management
  text:
    ru: A critical BigQuery table is sometimes corrupted by faulty jobs. You must be able to restore the table to its state on any day in the last 30 days, with the lowest cost and effort. What should you do?
  options:
  - text:
      ru: Increase the dataset's time travel window to 30 days
    correct: false
  - text:
      ru: Create a daily table snapshot with a 30-day expiration, for example with a scheduled query
    correct: true
  - text:
      ru: Rely on fail-safe storage to recover the table
    correct: false
