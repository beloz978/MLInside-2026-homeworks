- id: q60
  section: main
  multi: true
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S4 Data management
  text:
    ru: A security reviewer asks how data is protected in Google Cloud. Which two statements are true? (Choose two.)
  options:
  - text:
      ru: Data at rest is encrypted by default with Google-managed keys
    correct: true
  - text:
      ru: CMEK must be configured before any data is encrypted at rest
    correct: false
  - text:
      ru: Data in transit between users and Google front ends is encrypted with TLS
    correct: true
  - text:
      ru: Encryption at rest also protects data while it travels over the network
    correct: false
  - text:
      ru: CSEK is the default encryption method for BigQuery tables
    correct: false
  hints:
    ru: []
  explanation:
    ru: S4 (4.4). По умолчанию все данные в покое шифруются ключами Google (GMEK), трафик к Google Front End защищён TLS. CMEK опционален, шифрование at rest не защищает передачу по сети, CSEK — не значение по умолчанию и не поддерживается в BigQuery.
