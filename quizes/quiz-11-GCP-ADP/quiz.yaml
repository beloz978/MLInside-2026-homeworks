- id: q43
  section: main
  multi: false
  difficulty: средний
  level:
    ru: 🟨 применение
  topic:
    ru: S4 Data management
  text:
    ru: A Cloud SQL for PostgreSQL instance must fail over automatically if its zone becomes unavailable, with no data loss. What should you do?
  options:
  - text:
      ru: Create a read replica in another zone
    correct: false
  - text:
      ru: Enable automated daily backups
    correct: false
  - text:
      ru: Enable the high availability (regional) configuration
    correct: true
  - text:
      ru: Export the database to Cloud Storage every hour
    correct: false
  hints:
    ru: []
  explanation:
    ru: S4 (4.3). HA-конфигурация держит standby в другой зоне с синхронной репликацией и переключается автоматически. Read replica не переключается сама, бэкапы и экспорт дают потерю данных и ручное восстановление.
