title: Тест 4. Оркестрация данных и ML-пайплайнов в Dagster
questions:
- id: q1
  section: main
  level: 🟩 понимание
  difficulty: средний
  text: Что верно про Dagster и Airflow 3? Несколько вариантов.
  multi: true
  options:
  - text: В Dagster узел графа — ассет, то есть результат (таблица, файл, модель)
    correct: true
  - text: В Airflow 3 планировать запуски по ассетам нельзя
    correct: false
  - text: В Airflow 3 граф по-прежнему состоит из задач
    correct: true
  - text: В Dagster lineage приходится описывать вручную
    correct: false
  - text: В Airflow 3 ассет — событие, по которому запускается DAG
    correct: true
  hint: Подумайте, что в каждом инструменте является узлом графа, а что — событием между графами.
  explanation: Dagster описывает не «работу, которую надо выполнить», а результат. Зависимости задаются между ассетами, поэтому lineage строится сам, а проверки и метаданные привязаны к ассету. В Airflow 3 `@asset` упрощает запись и позволяет запускать DAG по событию (asset-aware scheduling), но единица графа по-прежнему задача.
- id: q2
  section: main
  level: 🟩 понимание
  difficulty: простой
  text: Зачем ассету принимать ресурс параметром (например, `dwh`), а не создавать подключение внутри функции?
  multi: false
  options:
  - text: Чтобы ассет выполнялся быстрее за счёт общего подключения
    correct: false
  - text: Чтобы менять подключение по окружениям, не правя код ассета
    correct: true
  - text: Чтобы Dagster шифровал данные, которые ассет читает и пишет
    correct: false
  - text: Чтобы каждый ассет запускался в отдельном процессе
    correct: false
  hint: null
  explanation: имя параметра совпадает с ключом в `Definitions(resources={...})`. Код ассета не знает, dev это или prod, — меняется только ресурс. В тесте в тот же параметр передают временную реализацию. Ускорения, шифрования и отдельного процесса ресурс сам по себе не даёт.
- id: q3
  section: main
  level: 🟩 понимание
  difficulty: простой
  text: Кто отвечает за то, где лежит значение, которое вернул ассет, и откуда его возьмёт следующий ассет?
  multi: false
  options:
  - text: IO manager
    correct: true
  - text: Asset check
    correct: false
  - text: Run storage
    correct: false
  - text: Executor
    correct: false
  hint: null
  explanation: ассет делает только `return`, а сохранение и загрузку значения между ассетами берёт на себя IO manager (например, `DuckDBPandasIOManager`, `FilesystemIOManager`). Поменять хранилище можно, не трогая код ассетов. Run storage хранит записи о запусках, а не данные; executor решает, как выполнять шаги (в одном процессе или в нескольких); asset check только проверяет результат.
- id: q4
  section: main
  level: 🟨 применение
  difficulty: простой
  text: Расписание включено в интерфейсе, webserver работает, но запуски по времени не создаются. Какой компонент, скорее всего, не запущен?
  multi: false
  options:
  - text: IO manager
    correct: false
  - text: Code server
    correct: false
  - text: dagster-daemon
    correct: true
  - text: Run launcher
    correct: false
  hint: null
  explanation: webserver только показывает состояние. Тики расписаний и сенсоров, очередь запусков и automation выполняет daemon. Локально `dg dev` поднимает и webserver, и daemon, а в продакшене daemon нужно запускать отдельно. Без code server интерфейс показал бы ошибку загрузки code location; run launcher и IO manager — не отдельные процессы, а настройки, и до них дело доходит, только когда запуск уже создан.
- id: q5
  section: main
  level: 🟨 применение
  difficulty: средний
  text: Сенсор следит за папкой и на каждый новый CSV создаёт запуск. Что гарантирует, что повторный тик не создаст второй запуск на тот же файл?
  multi: false
  options:
  - text: '`minimum_interval_seconds` сенсора'
    correct: false
  - text: '`run_key` в `RunRequest`'
    correct: true
  - text: Курсор сенсора
    correct: false
  - text: '`partition_key` в `RunRequest`'
    correct: false
  hint: Один механизм отвечает за «откуда продолжить», другой — за «не создавать уже созданное».
  explanation: '`run_key` (например, имя файла) — ключ идемпотентности: запуск с тем же `run_key` повторно не создаётся. Курсор нужен, чтобы не перебирать уже обработанное, но сам по себе дубль не запрещает; `minimum_interval_seconds` задаёт только частоту тиков, а `partition_key` говорит, какую партицию считать.'
- id: q6
  section: main
  level: 🟨 применение
  difficulty: средний
  text: Что происходит при подключении dbt-проекта через `dagster-dbt`? Несколько вариантов.
  multi: true
  options:
  - text: Каждая dbt-модель становится ассетом
    correct: true
  - text: dbt-тесты отображаются как asset checks
    correct: true
  - text: Исполнение SQL моделей переходит от dbt к Dagster
    correct: false
  - text: Связи между ассетами строятся по `ref` и `source` из `manifest.json`
    correct: true
  hint: Кто на самом деле выполняет SQL и из какого артефакта dbt Dagster берёт структуру проекта?
  explanation: 'SQL по-прежнему выполняет dbt (через `DbtCliResource`, обычно `dbt build`), а Dagster читает `manifest.json`, строит из него ассеты и lineage и показывает результаты тестов как проверки. Если ключи dbt-источников не совпадают с ключами raw-ассетов, граф получит разрыв: ключи задают через `meta.dagster.asset_key` или `DagsterDbtTranslator`.'
- id: q7
  section: main
  level: 🟨 применение
  difficulty: средний
  text: После исправления логики ассета с daily-партициями нужно пересчитать последние 30 дней. Что использовать?
  multi: false
  options:
  - text: Re-execute последнего запуска из интерфейса
    correct: false
  - text: Backfill по диапазону партиций
    correct: true
  - text: Wipe материализаций ассета
    correct: false
  - text: Reload code location
    correct: false
  hint: Нужно запустить материализацию сразу для многих партиций, а не повторить один запуск.
  explanation: backfill запускает материализацию выбранных партиций, при этом каждая партиция считается идемпотентно, поэтому повторный пересчёт безопасен. Re-execute повторит только последний запуск, то есть одну партицию; wipe лишь стирает историю материализаций и ничего не пересчитывает; reload подхватывает новый код, но запусков не создаёт.
- id: q8
  section: main
  level: 🟥 анализ
  difficulty: сложный
  text: Из-за сбоя загрузки витрина иногда оказывается пустой, а обучение модели всё равно стартует и «успешно» завершается. Что лучше всего закроет проблему?
  multi: false
  options:
  - text: RetryPolicy на ассете обучения с несколькими повторами
    correct: false
  - text: Asset check `row_count > 0` на витрине с severity WARN
    correct: false
  - text: Freshness check на витрине через `build_last_update_freshness_checks`
    correct: false
  - text: 'Блокирующий asset check на витрине: `row_count > 0`'
    correct: true
  hint: Нужна мера, которая не просто сообщает о проблеме, а не даёт выполниться зависимым ассетам.
  explanation: retry повторит запуск на тех же пустых данных. Обычная проверка с severity WARN пометит проблему, но обучение не остановит. Freshness check следит за тем, когда ассет обновлялся, а пустая витрина как раз обновилась вовремя. Asset check с `blocking=True` при провале не даёт выполниться зависимым ассетам в этом запуске, а с Declarative Automation то же даёт `all_deps_blocking_checks_passed`. Результат проверки (row_count) заодно остаётся в метаданных ассета.
- id: q9
  section: main
  level: 🟨 применение
  difficulty: средний
  text: Как в pytest проверить два связанных ассета без БД и Docker?
  multi: false
  options:
  - text: Запустить `dg dev` и прогнать оба ассета в интерфейсе
    correct: false
  - text: Вызвать `dagster asset materialize --select ...` через subprocess
    correct: false
  - text: Вызвать `materialize_to_memory` с тестовыми ресурсами
    correct: true
  - text: Запустить `dbt test` в pytest-тесте для моделей этих ассетов
    correct: false
  hint: Ищите способ прогнать ассеты механизмом Dagster, но с подменёнными ресурсами и без внешних сервисов.
  explanation: '`materialize_to_memory` прогоняет цепочку настоящим механизмом Dagster, сам передаёт значения между ассетами и подставляет тестовые ресурсы. CLI-материализация и `dg dev` используют настоящие ресурсы и IO manager, то есть ту самую БД; `dbt test` проверяет данные моделей, а не ассеты Dagster. Отдельный ассет можно вызвать как обычную функцию. В CI дополнительно запускают `dg check defs`, чтобы убедиться, что определения загружаются.'
- id: q10
  section: main
  level: 🟥 анализ
  difficulty: сложный
  text: Витрина `mart_order_features` лежит в code location `transform`, а `training_dataset` — в code location `ml`. Обучение должно стартовать после обновления витрины. Как это организовать?
  multi: false
  options:
  - text: Импортировать код `transform` в `ml` и вызывать функцию витрины напрямую
    correct: false
  - text: Объединить всё в один code location, иначе lineage не построится
    correct: false
  - text: Продублировать витрину в `ml` и создать для неё там отдельный ассет
    correct: false
  - text: Указать `deps=[AssetKey("mart_order_features")]` и запускать по событию
    correct: true
  hint: Ассеты разных code location видят друг друга по ключу, но в один запуск не попадают.
  explanation: 'ассеты разных code location связываются по ключу без импорта кода, и в интерфейсе это одно ребро графа. Но один запуск не материализует ассеты из разных locations, поэтому связывать их нужно событием: automation-условием на `training_dataset`, сенсором или расписанием. Раздельные locations — это независимые пакеты и образы, при общем графе.'
- id: r1
  section: reserve
  level: 🟨 применение
  difficulty: средний
  text: Загрузка raw иногда опаздывает, и обучение по расписанию в 06:00 проходит на вчерашних данных. Чем лучше заменить расписание?
  multi: false
  options:
  - text: Сдвинуть расписание обучения на час позже, на 07:00
    correct: false
  - text: Расписанием `ScheduleDefinition` с cron каждые 5 минут
    correct: false
  - text: Добавить RetryPolicy на ассет обучения и витрины
    correct: false
  - text: Задать ассету обучения условие automation `eager`
    correct: true
  hint: Обучение должно зависеть от факта обновления данных, а не от времени.
  explanation: условие живёт на ассете и срабатывает по факту обновления upstream, а не по времени, поэтому в день опоздания загрузки обучение подождёт, а не пройдёт на вчерашних данных. Частое расписание всё равно привязано ко времени и будет переобучать модель без новых данных. Выполняет условия automation-сенсор внутри daemon, поэтому daemon нужен.
- id: r2
  section: reserve
  level: 🟨 применение
  difficulty: простой
  text: Что использовать, чтобы отправить сообщение в Telegram при падении запуска?
  multi: false
  options:
  - text: '`@dg.run_failure_sensor`'
    correct: true
  - text: '`@dg.asset_sensor`'
    correct: false
  - text: '`AutomationCondition.eager()`'
    correct: false
  - text: '`AssetCheckSeverity.ERROR`'
    correct: false
  hint: null
  explanation: '`run_failure_sensor` вызывается при падении запуска и получает контекст с информацией о сбое; внутри него отправляют сообщение (для Slack есть готовый `make_slack_on_run_failure_sensor`). `asset_sensor` реагирует на материализацию ассета, а не на сбой; `eager` и severity к оповещениям не относятся. Повторы (`RetryPolicy`) и оповещение обычно ставят вместе: сначала повторы, потом сообщение.'
- id: r3
  section: reserve
  level: 🟨 применение
  difficulty: простой
  text: Ассет иногда падает из-за временной недоступности внешнего API. Что добавить?
  multi: false
  options:
  - text: Блокирующий asset check на недоступность внешнего API
    correct: false
  - text: '`RetryPolicy` с задержкой на ассете'
    correct: true
  - text: Freshness check на ассет с допуском в один час
    correct: false
  - text: Второй экземпляр daemon для надёжности
    correct: false
  hint: null
  explanation: '`RetryPolicy` повторяет упавший шаг (с `delay` и `backoff`), и временный сбой проходит без ручного перезапуска. Asset check и freshness check проверяют результат или его свежесть, а не повторяют шаг; второй daemon с отказом внешнего API не связан.'
- id: r4
  section: reserve
  level: 🟩 знание
  difficulty: простой
  text: Как показать число загруженных строк рядом с ассетом в интерфейсе Dagster?
  multi: false
  options:
  - text: 'Задать `tags={"row_count": "..."}` в декораторе `@asset`'
    correct: false
  - text: Вывести число через `context.log.info` в теле ассета
    correct: false
  - text: Создать отдельный IO manager для хранения счётчика
    correct: false
  - text: 'Вернуть `MaterializeResult` с `metadata={"row_count": n}`'
    correct: true
  hint: null
  explanation: метаданные материализации хранятся вместе с ассетом, показываются в интерфейсе и по ним видна история между запусками (то же даёт `context.add_output_metadata`). Теги задаются при определении ассета и не меняются от запуска к запуску; лог остаётся в логах запуска и к ассету не привязан.
- id: r5
  section: reserve
  level: 🟥 анализ
  difficulty: сложный
  text: После подключения dbt-проекта в графе есть raw-ассет `raw_orders` и dbt-модель `stg_orders`, но между ними нет связи. Что, скорее всего, не так?
  multi: false
  options:
  - text: Ключ dbt-source не совпадает с ключом `raw_orders`
    correct: true
  - text: У ассета `raw_orders` не настроен IO manager
    correct: false
  - text: Не запущен dagster-daemon, который обновляет граф
    correct: false
  - text: У ассета `raw_orders` другой `group_name`
    correct: false
  hint: dagster-dbt связывает ассеты не по именам таблиц, а по ключам ассетов.
  explanation: dagster-dbt строит связи по ключам ассетов; если ключ dbt-источника отличается от ключа raw-ассета, граф получает разрыв. Ключи выравнивают через `meta.dagster.asset_key` в описании source или через `DagsterDbtTranslator`. Daemon граф не строит, IO manager отвечает за данные, а группа влияет только на отображение.
- id: r6
  section: reserve
  level: 🟩 знание
  difficulty: простой
  text: Ассет нужно считать по дням, начиная с 2024-01-01. Что указать в `@asset(partitions_def=...)`?
  multi: false
  options:
  - text: '`StaticPartitionsDefinition([...])` со списком дат'
    correct: false
  - text: '`DailyPartitionsDefinition(start_date="2024-01-01")`'
    correct: true
  - text: '`TimeWindowPartitionMapping(start_offset=-1)`'
    correct: false
  - text: '`ScheduleDefinition(cron_schedule="0 0 * * *")`'
    correct: false
  hint: null
  explanation: '`DailyPartitionsDefinition` сам заводит партицию на каждый день от `start_date`. Статический список придётся дополнять вручную; `TimeWindowPartitionMapping` описывает, как партиции одного ассета зависят от партиций другого; расписание запускает, но партиций не задаёт.'
- id: r7
  section: reserve
  level: 🟨 применение
  difficulty: средний
  text: Ресурсу DWH нужен пароль. Как передать его, чтобы он не хранился в коде и не показывался в интерфейсе Dagster?
  multi: false
  options:
  - text: Прочитать `os.getenv("DWH_PASSWORD")` при создании ресурса
    correct: false
  - text: Передать пароль через `run_config` при запуске
    correct: false
  - text: Указать `password=dg.EnvVar("DWH_PASSWORD")` в ресурсе
    correct: true
  - text: Положить пароль в `tags` ресурса в `Definitions`
    correct: false
  hint: Значение должно читаться в момент запуска, а в интерфейсе показываться только имя переменной.
  explanation: '`EnvVar` читает значение в момент запуска, а в интерфейсе показывает только имя переменной. `os.getenv` читает значение при загрузке code location, и оно становится видно в интерфейсе; `run_config` и теги сохраняются вместе с запуском в открытом виде.'
- id: r8
  section: reserve
  level: 🟨 применение
  difficulty: средний
  text: Ассеты возвращают pandas DataFrame. Нужно, чтобы результаты сохранялись таблицами в DuckDB, а код ассетов не менялся. Что подключить под ключом `io_manager`?
  multi: false
  options:
  - text: '`DuckDBResource(database="olist.duckdb")`'
    correct: false
  - text: '`FilesystemIOManager(base_dir="data")`'
    correct: false
  - text: '`mem_io_manager` из стандартной поставки'
    correct: false
  - text: '`DuckDBPandasIOManager(database="olist.duckdb")`'
    correct: true
  hint: Нужен IO manager, который сам пишет DataFrame в таблицу, а не просто даёт подключение.
  explanation: '`DuckDBPandasIOManager` сам записывает возвращённый DataFrame в таблицу и читает его для следующего ассета. `DuckDBResource` даёт только подключение, и SQL пришлось бы писать в ассете; `FilesystemIOManager` сохраняет pickle-файлы, а `mem_io_manager` держит значения в памяти одного запуска.'
- id: r9
  section: reserve
  level: 🟥 анализ
  difficulty: сложный
  text: Витрину нужно пересчитывать сразу после обновления raw, но только если блокирующие проверки raw прошли. Какое условие задать витрине?
  multi: false
  options:
  - text: '`AutomationCondition.on_cron("0 6 * * *")`'
    correct: false
  - text: '`AutomationCondition.eager() & AutomationCondition.all_deps_blocking_checks_passed()`'
    correct: true
  - text: '`AutomationCondition.missing() & AutomationCondition.any_deps_updated()`'
    correct: false
  - text: '`AutomationCondition.eager() | AutomationCondition.all_deps_blocking_checks_passed()`'
    correct: false
  hint: 'Обратите внимание на оператор между условиями: должны выполняться оба сразу.'
  explanation: '`eager()` срабатывает на обновление зависимостей, а `&` с `all_deps_blocking_checks_passed()` добавляет требование, что блокирующие проверки upstream прошли. С `|` хватило бы одного из условий, и витрина пересчиталась бы и на плохих данных. `on_cron` привязан ко времени, а `missing()` верно только для ни разу не материализованного ассета.'
- id: r10
  section: reserve
  level: 🟨 применение
  difficulty: простой
  text: Нужно материализовать `mart_order_features` вместе со всеми ассетами, от которых она зависит. Какой выбор ассетов взять?
  multi: false
  options:
  - text: '`AssetSelection.assets("mart_order_features").downstream()`'
    correct: false
