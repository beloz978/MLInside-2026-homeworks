    en: '`DailyPartitionsDefinition` creates a partition for every day from `start_date` by itself. A static list has to be extended by hand; `TimeWindowPartitionMapping` describes how partitions of one asset depend on partitions of another; a schedule launches runs but does not define partitions.'
