    correct: false
  - text:
      ru: '`DailyPartitionsDefinition(start_date="2024-01-01")`'
      en: '`DailyPartitionsDefinition(start_date="2024-01-01")`'
    correct: true
  - text:
      ru: '`TimeWindowPartitionMapping(start_offset=-1)`'
      en: '`TimeWindowPartitionMapping(start_offset=-1)`'
    correct: false
  - text:
      ru: '`ScheduleDefinition(cron_schedule="0 0 * * *")`'
      en: '`ScheduleDefinition(cron_schedule="0 0 * * *")`'
