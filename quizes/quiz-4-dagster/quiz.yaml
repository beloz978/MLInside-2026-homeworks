- id: r9
  section: reserve
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
    en: 🟥 analysis
  topic:
    ru: Автоматизация
    en: Automation
  text:
    ru: Витрину нужно пересчитывать сразу после обновления raw, но только если блокирующие проверки raw прошли. Какое условие задать витрине?
    en: The mart must be recomputed right after raw is updated, but only if the blocking checks on raw have passed. Which condition should be set on the mart?
  options:
  - text:
      ru: '`AutomationCondition.on_cron("0 6 * * *")`'
      en: '`AutomationCondition.on_cron("0 6 * * *")`'
    correct: false
  - text:
      ru: '`AutomationCondition.eager() & AutomationCondition.all_deps_blocking_checks_passed()`'
      en: '`AutomationCondition.eager() & AutomationCondition.all_deps_blocking_checks_passed()`'
    correct: true
  - text:
      ru: '`AutomationCondition.missing() & AutomationCondition.any_deps_updated()`'
      en: '`AutomationCondition.missing() & AutomationCondition.any_deps_updated()`'
    correct: false
  - text:
      ru: '`AutomationCondition.eager() | AutomationCondition.all_deps_blocking_checks_passed()`'
      en: '`AutomationCondition.eager() | AutomationCondition.all_deps_blocking_checks_passed()`'
    correct: false
  hints:
    ru:
    - 'Обратите внимание на оператор между условиями: должны выполняться оба сразу.'
    en:
    - 'Look at the operator between the conditions: both must hold at once.'
  explanation:
    ru: '`eager()` срабатывает на обновление зависимостей, а `&` с `all_deps_blocking_checks_passed()` добавляет требование, что блокирующие проверки upstream прошли. С `|` хватило бы одного из условий, и витрина пересчиталась бы и на плохих данных. `on_cron` привязан ко времени, а `missing()` верно только для ни разу не материализованного ассета.'
    en: '`eager()` fires on an update of dependencies, and `&` with `all_deps_blocking_checks_passed()` adds the requirement that the upstream blocking checks have passed. With `|` one of the conditions would be enough, and the mart would be recomputed on bad data too. `on_cron` is tied to time, and `missing()` is true only for an asset that has never been materialized.'
- id: r10
  section: reserve
  multi: false
  difficulty: простой
  level:
    ru: 🟨 применение
    en: 🟨 application
  topic:
    ru: Запуск и выбор ассетов
    en: Running and selecting assets
  text:
    ru: Нужно материализовать `mart_order_features` вместе со всеми ассетами, от которых она зависит. Какой выбор ассетов взять?
    en: '`mart_order_features` has to be materialized together with all the assets it depends on. Which asset selection should be used?'
  options:
  - text:
      ru: '`AssetSelection.assets("mart_order_features").downstream()`'
      en: '`AssetSelection.assets("mart_order_features").downstream()`'
    correct: false
  - text:
      ru: '`AssetSelection.groups("mart_order_features")`'
      en: '`AssetSelection.groups("mart_order_features")`'
    correct: false
  - text:
      ru: '`AssetSelection.assets("mart_order_features").upstream()`'
      en: '`AssetSelection.assets("mart_order_features").upstream()`'
    correct: true
  - text:
      ru: '`AssetSelection.assets("mart_order_features")`'
      en: '`AssetSelection.assets("mart_order_features")`'
    correct: false
  hints:
    ru: []
    en: []
  explanation:
    ru: '`.upstream()` добавляет к ассету всё, от чего он зависит (в строке выбора то же даёт `+mart_order_features`). `.downstream()` берёт зависимые ассеты, `groups` ищет группу с таким именем, а выбор без модификатора материализует только саму витрину.'
    en: '`.upstream()` adds everything the asset depends on (in a selection string `+mart_order_features` does the same). `.downstream()` takes the dependent assets, `groups` looks for a group with that name, and a selection without a modifier materializes only the mart itself.'
