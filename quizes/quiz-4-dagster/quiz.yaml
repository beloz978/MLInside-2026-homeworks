    en: How to show the number of loaded rows next to an asset in the Dagster UI?
  options:
  - text:
      ru: 'Задать `tags={"row_count": "..."}` в декораторе `@asset`'
      en: 'Set `tags={"row_count": "..."}` in the `@asset` decorator'
    correct: false
  - text:
      ru: Вывести число через `context.log.info` в теле ассета
      en: Print the number with `context.log.info` in the asset body
    correct: false
  - text:
      ru: Создать отдельный IO manager для хранения счётчика
      en: Create a separate IO manager to store the counter
    correct: false
  - text:
      ru: 'Вернуть `MaterializeResult` с `metadata={"row_count": n}`'
      en: 'Return `MaterializeResult` with `metadata={"row_count": n}`'
    correct: true
  hints:
    ru: []
    en: []
  explanation:
    ru: метаданные материализации хранятся вместе с ассетом, показываются в интерфейсе и по ним видна история между запусками (то же даёт `context.add_output_metadata`). Теги задаются при определении ассета и не меняются от запуска к запуску; лог остаётся в логах запуска и к ассету не привязан.
    en: materialization metadata is stored with the asset, shown in the UI, and its history is visible across runs (`context.add_output_metadata` does the same). Tags are set when the asset is defined and do not change from run to run; a log stays in the run logs and is not tied to the asset.
- id: r5
  section: reserve
  multi: false
  difficulty: сложный
  level:
    ru: 🟥 анализ
    en: 🟥 analysis
  topic:
    ru: Интеграция с dbt
    en: dbt integration
  text:
    ru: После подключения dbt-проекта в графе есть raw-ассет `raw_orders` и dbt-модель `stg_orders`, но между ними нет связи. Что, скорее всего, не так?
    en: After connecting a dbt project, the graph has a raw asset `raw_orders` and a dbt model `stg_orders`, but there is no link between them. What is most likely wrong?
  options:
  - text:
      ru: Ключ dbt-source не совпадает с ключом `raw_orders`
      en: The dbt source key does not match the key of `raw_orders`
    correct: true
  - text:
      ru: У ассета `raw_orders` не настроен IO manager
      en: The `raw_orders` asset has no IO manager configured
    correct: false
  - text:
      ru: Не запущен dagster-daemon, который обновляет граф
      en: The dagster-daemon that updates the graph is not running
    correct: false
  - text:
      ru: У ассета `raw_orders` другой `group_name`
      en: The `raw_orders` asset has a different `group_name`
    correct: false
  hints:
    ru:
    - dagster-dbt связывает ассеты не по именам таблиц, а по ключам ассетов.
    en:
    - dagster-dbt links assets not by table names but by asset keys.
  explanation:
    ru: dagster-dbt строит связи по ключам ассетов; если ключ dbt-источника отличается от ключа raw-ассета, граф получает разрыв. Ключи выравнивают через `meta.dagster.asset_key` в описании source или через `DagsterDbtTranslator`. Daemon граф не строит, IO manager отвечает за данные, а группа влияет только на отображение.
    en: dagster-dbt builds links from asset keys; if the key of the dbt source differs from the key of the raw asset, the graph has a gap. Keys are aligned with `meta.dagster.asset_key` in the source description or with `DagsterDbtTranslator`. The daemon does not build the graph, the IO manager is responsible for data, and the group only affects how things are displayed.
