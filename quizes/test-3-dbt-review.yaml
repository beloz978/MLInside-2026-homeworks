title: Ревью теста 3 «Трансформация данных и витрины с dbt»
questions:
- id: q2
  section: main
  level: 🟩 понимание
  difficulty: null
  text: Что обычно лежит в файле модели dbt и что с ним делает dbt?
  multi: false
  options:
  - text: Скрипт, который загружает данные из внешнего источника
    correct: false
  - text: SELECT-запрос (SQL с Jinja), который dbt превращает в view или table
    correct: true
  - text: Описание расписания запуска
    correct: false
  - text: Обученную ML-модель
    correct: false
  hint: null
  explanation: модель — это SELECT в файле `.sql`; dbt компилирует Jinja, добавляет `CREATE ... AS` и выполняет в целевой базе. (Python-модели существуют, но поддерживаются не всеми адаптерами.)
- id: q5
  section: main
  level: 🟨 применение
  difficulty: null
  text: Таблица заказов — десятки миллионов строк, каждый день приходят новые и изменённые строки с полем `updated_at`. Как лучше материализовать модель?
  multi: false
  options:
  - text: '`table`: полная пересборка каждый раз'
    correct: false
  - text: '`incremental` с фильтром по `updated_at` внутри `is_incremental()` и `unique_key`'
    correct: true
  - text: '`ephemeral`'
    correct: false
  - text: '`view`'
    correct: false
  hint: null
  explanation: incremental обрабатывает только изменившуюся часть. Для корректности нужны критерий дельты (`updated_at`) и `unique_key`, чтобы обновлённые строки не дублировались. После изменения логики модели её пересобирают с `--full-refresh`.
- id: q6
  section: main
  level: 🟨 применение
  difficulty: null
  text: Какие проверки относятся к встроенным generic tests? Несколько вариантов.
  multi: true
  options:
  - text: '`unique`'
    correct: true
  - text: '`accepted_values`'
    correct: true
  - text: '`relationships`'
    correct: true
  - text: SQL-файл в папке ``, возвращающий строки с нарушениями
    correct: false
  - text: Блок `unit_tests:` с `given` и `expect`
    correct: false
  hint: null
  explanation: 'встроенные generic tests — `not_null`, `unique`, `accepted_values`, `relationships`. SQL-файл в `` — singular test, блок с входами и ожидаемым результатом — unit test (dbt 1.8+). Баллы: +1 за верный, −1 за лишний, не ниже 0.'
- id: q8
  section: main
  level: 🟥 анализ
  difficulty: null
  text: Загрузка raw-данных идёт в 05:00 по cron, `dbt build` — в 06:00 на другой машине. Однажды загрузка закончилась в 07:00, и витрины пересчитались на вчерашних данных. Чего не хватает?
  multi: false
  options:
  - text: Больше generic-тестов
    correct: false
  - text: Оркестратора, который знает, что dbt нужно запускать после загрузки, и умеет повторы и алерты
    correct: true
  - text: Перехода с Core на другой адаптер
    correct: false
  - text: Переноса моделей из `marts` в `staging`
    correct: false
  hint: null
  explanation: 'dbt Core отвечает за зависимости между моделями, но не за порядок относительно внешних задач (загрузка) и не имеет планировщика. Эту роль берёт оркестратор (cron — минимум, Dagster или Airflow — полноценно): запуск после события, повторы, оповещения.'
