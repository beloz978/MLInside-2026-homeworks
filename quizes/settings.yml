# Настройки тестов: читают quizes/md2yaml.py (самопроверка) и quizes/quiz.py (показ подсказок).
quiz:
  # уровни сложности в заголовке вопроса: «Вопрос 4 🟨 применение · средний»
  difficulties: [простой, средний, сложный]
  # для этих уровней строка «Подсказка: …» обязательна и показывается в quiz.py
  hint_difficulties: [средний, сложный]
